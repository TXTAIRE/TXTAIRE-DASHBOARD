<div id="ess-app">

    <div style="display:flex; gap:14px; align-items:center;">

      <button id="admin-logout" class="link-btn">Sign out</button>
    </div>
  </header>
  <main id="admin-main" class="ess-main" style="padding-bottom:24px;">
    <div class="ess-sub">Checking access…</div>
  </main>
</div>
