name: Deploy to GitHub Pages

# Runs on every push to master, and can be triggered manually. This deploys the same
# static files Netlify serves — no build step, since the app has none. Set up as a
# fallback so the site stays reachable and up to date even while Netlify's deploys are
# paused (see README.md — Netlify's team ran out of monthly build minutes).
on:
  push:
    branches: [master]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
