name: Deploy to GitHub Pages

# Runs on every push to master, and can be triggered manually. No build step, since the
# app has none — the static files are published as they are.
#
# This is now the site of record:
#
#   https://txtaire.github.io/TXTAIRE-DASHBOARD/
#
# It began as a fallback while Netlify's deploys were paused (that team ran out of
# monthly build minutes). Netlify is no longer relied on, and its URL is not recorded
# anywhere in this repository. If a Netlify site is still up somewhere it is serving a
# STALE build — which matters, because this repo publishes the Code of Discipline, and
# two live copies stating different penalties is a problem. Point staff here.
#
# The earlier version of this comment said "see README.md". There is no README.md in
# this repository and there never has been.
on:
  push:
    branches: [master]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
