<title>TxTAIRE HQ &middot; HR &amp; Operations</title>
<style>
:root {
  --bg: #ffffff;
  --bg-elevated: #f6f7f9;
  --bg-card: #ffffff;
  --bg-hover: #f0f1f3;
  --border: #dcdde1;
  --border-soft: #e6e7eb;
  --text: #0a0a0a;
  --text-dim: #55565c;
  --text-faint: #8a8b90;
  --accent: #2f6fed;
  --accent-hover: #1d5be0;
  --accent-dim: rgba(47, 111, 237, 0.10);
  --accent-text: #ffffff;
  --brand-green: #1e8a4c;
  --green: #15803d;
  --red: #dc2626;
  --yellow: #b45309;
  --blue: #1d5be0;
  --shadow-card: 0 1px 2px rgba(16,24,40,0.04), 0 1px 6px rgba(16,24,40,0.05);
  --radius: 10px;
  --sidebar-w: 248px;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, "Segoe UI", Inter, Roboto, Arial, sans-serif;
  font-size: 14px;
  height: 100%;
}

#app {
  display: flex;
  min-height: 100vh;
}

/* ---------- Sidebar ---------- */
.sidebar {
  width: var(--sidebar-w);
  flex-shrink: 0;
  background: var(--bg-elevated);
  border-right: 1px solid var(--border-soft);
  padding: 18px 12px;
  position: fixed;
  top: 0;
  left: 0;
  bottom: 0;
  overflow-y: auto;
}

.brand {
  display: flex;
  align-items: center;
  padding: 6px 8px 22px 8px;
}
.brand-logo {
  width: 100%;
  max-width: 208px;
  height: auto;
}

.nav-group { margin-bottom: 18px; }
.nav-label {
  font-size: 10.5px;
  letter-spacing: 0.08em;
  color: var(--text-faint);
  text-transform: uppercase;
  padding: 4px 10px 6px 10px;
  font-weight: 600;
}
.nav-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 10px;
  border-radius: 8px;
  color: var(--text-dim);
  text-decoration: none;
  cursor: pointer;
  font-size: 13.5px;
  margin-bottom: 2px;
  transition: background .12s, color .12s;
}
.nav-item:hover { background: var(--bg-hover); color: var(--text); }
.nav-item.active {
  background: var(--accent);
  color: var(--accent-text);
  font-weight: 600;
}
.nav-item .ic { width: 16px; text-align: center; opacity: .9; }

.sidebar-foot {
  margin-top: 24px;
  padding: 10px 10px 4px 10px;
  border-top: 1px solid var(--border-soft);
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 12.5px;
  color: var(--text-dim);
}
.avatar-chip {
  width: 26px; height: 26px; border-radius: 50%;
  background: var(--accent-dim); color: var(--accent);
  display: flex; align-items: center; justify-content: center;
  font-weight: 700; font-size: 11px;
}

/* ---------- Main ---------- */
.main {
  margin-left: var(--sidebar-w);
  flex: 1;
  padding: 28px 32px 60px 32px;
  max-width: 1280px;
}

.crumb {
  font-size: 11.5px;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  color: var(--text-faint);
  margin-bottom: 6px;
}
.page-head {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  margin-bottom: 18px;
  gap: 16px;
  flex-wrap: wrap;
}
.page-title { font-size: 26px; font-weight: 700; margin: 0; }
.page-sub { color: var(--text-dim); font-size: 13px; margin-top: 4px; max-width: 620px; }

.tabs {
  display: flex;
  gap: 22px;
  border-bottom: 1px solid var(--border-soft);
  margin-bottom: 20px;
}
.tab {
  padding: 9px 2px 12px 2px;
  color: var(--text-dim);
  cursor: pointer;
  font-size: 13.5px;
  font-weight: 500;
  border-bottom: 2px solid transparent;
  margin-bottom: -1px;
  user-select: none;
}
.tab:hover { color: var(--text); }
.tab.active { color: var(--text); border-bottom-color: var(--accent); font-weight: 600; }

/* ---------- Buttons ---------- */
.btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 9px 16px;
  border-radius: 999px;
  border: none;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  transition: background .12s, opacity .12s;
  white-space: nowrap;
}
.btn-primary { background: var(--accent); color: var(--accent-text); }
.btn-primary:hover { background: var(--accent-hover); }
.btn-ghost { background: transparent; color: var(--text-dim); border: 1px solid var(--border); }
.btn-ghost:hover { color: var(--text); border-color: #3a3b3d; }
.btn-ghost.on { background: var(--bg-hover); color: var(--text); }
.btn-sm { padding: 6px 12px; font-size: 12px; }
.btn-danger { background: rgba(248,113,113,0.12); color: var(--red); }
.btn-danger:hover { background: rgba(248,113,113,0.2); }
.link-btn {
  background: none; border: none; color: var(--accent); cursor: pointer;
  font-size: 12.5px; font-weight: 600; padding: 0;
}

/* ---------- Cards / KPI ---------- */
.kpi-row {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
  gap: 14px;
  margin-bottom: 22px;
}
.kpi-card {
  background: var(--bg-card);
  border: 1px solid var(--border-soft);
  border-radius: var(--radius);
  padding: 16px 18px;
  box-shadow: var(--shadow-card);
}
.kpi-label {
  font-size: 10.5px;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--text-faint);
  margin-bottom: 8px;
  font-weight: 600;
}
.kpi-value { font-size: 26px; font-weight: 700; }
.kpi-value.green { color: var(--green); }
.kpi-value.red { color: var(--red); }
.kpi-sub { font-size: 11.5px; color: var(--text-faint); margin-top: 4px; }

.panel {
  background: var(--bg-card);
  border: 1px solid var(--border-soft);
  border-radius: var(--radius);
  overflow-x: auto;
  min-width: 0;
  box-shadow: var(--shadow-card);
}
.panel-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 18px;
  border-bottom: 1px solid var(--border-soft);
}
.panel-head h3 { margin: 0; font-size: 14px; font-weight: 600; }

/* ---------- Table ---------- */
table { width: 100%; border-collapse: collapse; }
thead th {
  text-align: left;
  font-size: 10.5px;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--text-faint);
  font-weight: 600;
  padding: 12px 16px;
  border-bottom: 1px solid var(--border-soft);
  white-space: nowrap;
}
tbody td {
  padding: 13px 16px;
  border-bottom: 1px solid var(--border-soft);
  font-size: 13.5px;
  vertical-align: middle;
}
tbody tr:last-child td { border-bottom: none; }
tbody tr:hover { background: rgba(255,255,255,0.02); }
td.name { font-weight: 600; }
td.name.row-link { cursor: pointer; }
td.name.row-link:hover { text-decoration: underline; }
td.dim { color: var(--text-dim); }
td.num { text-align: right; font-variant-numeric: tabular-nums; }
.days-input { width: 64px; text-align: right; padding: 6px 8px; }

.status-dot {
  display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--text-dim);
}
.status-dot::before {
  content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--text-faint);
}
.status-dot.on::before { background: var(--green); }
.status-dot.off::before { background: var(--text-faint); }
.status-dot.late::before { background: var(--yellow); }
.status-dot.absent::before { background: var(--red); }

.badge {
  display: inline-block;
  padding: 3px 10px;
  border-radius: 999px;
  font-size: 11px;
  font-weight: 600;
  white-space: nowrap;
}
.badge-orange { background: var(--accent-dim); color: var(--accent); }
.badge-green { background: rgba(74,222,128,0.14); color: var(--green); }
.badge-red { background: rgba(248,113,113,0.14); color: var(--red); }
.badge-blue { background: rgba(96,165,250,0.14); color: var(--blue); }
.badge-yellow { background: rgba(251,191,36,0.14); color: var(--yellow); }
.badge-gray { background: rgba(255,255,255,0.06); color: var(--text-dim); }

/* ---------- Toggle ---------- */
.toggle {
  width: 36px; height: 20px; border-radius: 999px;
  background: var(--border); position: relative; cursor: pointer;
  border: none; flex-shrink: 0;
}
.toggle.on { background: var(--accent); }
.toggle::after {
  content: ""; position: absolute; top: 2px; left: 2px;
  width: 16px; height: 16px; border-radius: 50%; background: #fff;
  transition: left .15s;
}
.toggle.on::after { left: 18px; }

/* ---------- Empty state ---------- */
.empty {
  padding: 48px 20px; text-align: center; color: var(--text-faint); font-size: 13px;
}

/* ---------- Filters bar ---------- */
.filters {
  display: flex; gap: 10px; align-items: flex-end; flex-wrap: wrap;
  background: var(--bg-card); border: 1px solid var(--border-soft);
  border-radius: var(--radius); padding: 16px 18px; margin-bottom: 18px;
}
.field { display: flex; flex-direction: column; gap: 6px; }
.field label {
  font-size: 10.5px; letter-spacing: 0.05em; text-transform: uppercase;
  color: var(--text-faint); font-weight: 600;
}
input, select, textarea {
  background: var(--bg);
  border: 1px solid var(--border);
  color: var(--text);
  border-radius: 7px;
  padding: 8px 10px;
  font-size: 13px;
  font-family: inherit;
}
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent); }
.seg { display: flex; gap: 4px; background: var(--bg); border: 1px solid var(--border); border-radius: 999px; padding: 3px; }
.seg button {
  background: none; border: none; color: var(--text-dim); padding: 6px 13px;
  border-radius: 999px; font-size: 12px; cursor: pointer; font-weight: 600;
}
.seg button.active { background: var(--accent); color: var(--accent-text); }

/* ---------- Kanban (recruitment) ---------- */
.kanban {
  display: grid;
  grid-auto-flow: column;
  grid-auto-columns: 250px;
  gap: 14px;
  overflow-x: auto;
  padding-bottom: 10px;
}
.kanban-col {
  background: var(--bg-card);
  border: 1px solid var(--border-soft);
  border-radius: var(--radius);
  display: flex;
  flex-direction: column;
  min-height: 160px;
  box-shadow: var(--shadow-card);
}
.kanban-col-head {
  padding: 12px 14px 10px 14px;
  border-bottom: 1px solid var(--border-soft);
  font-size: 12px;
  font-weight: 700;
  color: var(--text-dim);
  display: flex; justify-content: space-between; align-items: center;
}
.kanban-col-head .count {
  background: var(--bg-hover); color: var(--text-dim); border-radius: 999px;
  font-size: 11px; padding: 1px 8px;
}
.kanban-cards { padding: 10px; display: flex; flex-direction: column; gap: 8px; flex: 1; }
.kcard {
  background: var(--bg-elevated);
  border: 1px solid var(--border-soft);
  border-radius: 8px;
  padding: 10px 12px;
  cursor: pointer;
  transition: border-color .12s;
}
.kcard:hover { border-color: var(--accent); }
.kcard .kname { font-weight: 600; font-size: 13px; margin-bottom: 3px; }
.kcard .kmeta { font-size: 11px; color: var(--text-faint); }

/* ---------- Modal ---------- */
.modal-backdrop {
  position: fixed; inset: 0; background: rgba(0,0,0,0.55);
  display: flex; align-items: flex-start; justify-content: center;
  padding: 40px 20px; overflow-y: auto; z-index: 100;
}
.modal {
  background: var(--bg-elevated);
  border: 1px solid var(--border);
  border-radius: 14px;
  width: 100%;
  max-width: 560px;
  padding: 22px 24px 24px 24px;
  box-shadow: 0 8px 30px rgba(16,24,40,0.14);
}
.modal h2 { margin: 0 0 4px 0; font-size: 18px; }
.modal .modal-sub { color: var(--text-dim); font-size: 12.5px; margin-bottom: 16px; }
.modal-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 14px; }
.modal-grid .full { grid-column: 1 / -1; }
.modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 6px; }
.modal-close {
  position: absolute; top: 18px; right: 20px; background: none; border: none;
  color: var(--text-faint); font-size: 18px; cursor: pointer;
}
.modal-wrap { position: relative; }

/* ---------- Detail drawer ---------- */
.drawer-backdrop {
  position: fixed; inset: 0; background: rgba(0,0,0,0.45); z-index: 90;
}
.drawer {
  position: fixed; top: 0; right: 0; bottom: 0; width: 420px; max-width: 92vw;
  background: var(--bg-elevated); border-left: 1px solid var(--border);
  z-index: 95; overflow-y: auto; padding: 24px;
  box-shadow: -8px 0 30px rgba(16,24,40,0.10);
}
.drawer h2 { margin: 0 0 2px 0; font-size: 19px; }
.timeline { margin-top: 14px; display: flex; flex-direction: column; gap: 14px; }
.tl-item { display: flex; gap: 10px; }
.tl-dot {
  width: 9px; height: 9px; border-radius: 50%; background: var(--accent);
  margin-top: 5px; flex-shrink: 0;
}
.tl-body .tl-title { font-size: 13px; font-weight: 600; }
.tl-body .tl-meta { font-size: 11.5px; color: var(--text-faint); margin-top: 2px; }
.tl-body .tl-text { font-size: 12.5px; color: var(--text-dim); margin-top: 4px; }

.toast {
  position: fixed; bottom: 24px; right: 24px; background: var(--bg-elevated);
  border: 1px solid var(--border); color: var(--text); padding: 12px 18px;
  border-radius: 8px; font-size: 13px; z-index: 200; box-shadow: 0 8px 24px rgba(0,0,0,0.4);
}

.hint { font-size: 12px; color: var(--text-faint); line-height: 1.5; margin-bottom: 16px; max-width: 640px; }
.section-title { font-size: 15px; font-weight: 700; margin: 26px 0 12px 0; }
.two-col { display: grid; grid-template-columns: 1.3fr 1fr; gap: 20px; align-items: start; }
.two-col > div { min-width: 0; }
.kpi-row > .kpi-card { min-width: 0; }
.main { min-width: 0; overflow-x: hidden; }
@media (max-width: 980px) {
  .two-col { grid-template-columns: 1fr; }
}
@media (max-width: 720px) {
  .sidebar { width: 72px; padding: 14px 8px; }

  .brand-logo { display: none; }
  .main { margin-left: 72px; padding: 20px 16px 48px 16px; }
}

</style>

<script>
/* ================= js/store.js ================= */
/* TxTAIRE HR & Operations — local data store (localStorage-backed, no backend) */

window.Views = window.Views || {};

const STORAGE_KEY = 'txtaire_hr_v1';

const CATEGORIES = ['Admin', 'HR', 'Technician'];

const STAGES_STANDARD = ['Screening', 'Phone Interview', 'Face-to-Face Interview', '3-Day Trade Test', 'Evaluation', 'Decision'];
const STAGES_TECHNICIAN = ['Screening', 'Phone Interview', 'Candidate Agreement', '7-Day Trade Test', 'Evaluation', 'Decision'];

function stagesFor(category) {
  return category === 'Technician' ? STAGES_TECHNICIAN : STAGES_STANDARD;
}

function genId(prefix) {
  return prefix + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
}

function localISO(d) {
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return y + '-' + m + '-' + day;
}

function todayISO() {
  return localISO(new Date());
}

function addDays(isoDate, n) {
  const d = new Date(isoDate + 'T00:00:00');
  d.setDate(d.getDate() + n);
  return localISO(d);
}

function addMonths(isoDate, n) {
  const d = new Date(isoDate + 'T00:00:00');
  const day = d.getDate();
  d.setDate(1);
  d.setMonth(d.getMonth() + n);
  const lastDay = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate();
  d.setDate(Math.min(day, lastDay));
  return localISO(d);
}

function fmtDate(iso) {
  if (!iso) return '—';
  const d = new Date(iso + 'T00:00:00');
  return d.toLocaleDateString('en-US', { month: 'short', day: '2-digit', year: 'numeric' });
}

function fmtMoney(n) {
  const v = Number(n) || 0;
  return '₱' + v.toLocaleString('en-PH', { minimumFractionDigits: 0, maximumFractionDigits: 2 });
}

// Semi-monthly (every 15 days) withholding tax brackets. The first three rows are exactly
// as given; brackets above ₱33,332 extend the standard published BIR semi-monthly table
// as a safety net — no current employee's per-cutoff gross reaches that row.
function withholdingTax(gross) {
  const g = Number(gross) || 0;
  if (g <= 10417) return 0;
  if (g <= 16666) return 0.15 * (g - 10417);
  if (g <= 33332) return 937.5 + 0.20 * (g - 16667);
  if (g <= 83332) return 3541.8 + 0.25 * (g - 33333);
  if (g <= 333332) return 16291.8 + 0.30 * (g - 83333);
  if (g <= 666666) return 91291.8 + 0.32 * (g - 333333);
  return 200833.33 + 0.35 * (g - 666667);
}

const PAY_CYCLES = {
  '10-20': { label: 'Engineers, Managers & Admins — 10th & 20th', cutoffLabels: ['10th', '20th'] },
  '15-30': { label: 'Technicians — 15th & 30th/31st', cutoffLabels: ['15th', 'end of month'] },
};

function pad2(n) { return String(n).padStart(2, '0'); }

function daysInMonth(year, month) { return new Date(year, month, 0).getDate(); }

function payCutoffs(payCycle, year, month) {
  const y = year, m = month;
  const last = daysInMonth(y, m);
  if (payCycle === '15-30') {
    return [
      { key: 'A', label: `1 – 15 (paid the 15th)`, from: `${y}-${pad2(m)}-01`, to: `${y}-${pad2(m)}-15`, payDate: `${y}-${pad2(m)}-15` },
      { key: 'B', label: `16 – ${last} (paid the ${last}th)`, from: `${y}-${pad2(m)}-16`, to: `${y}-${pad2(m)}-${pad2(last)}`, payDate: `${y}-${pad2(m)}-${pad2(last)}` },
    ];
  }
  return [
    { key: 'A', label: `1 – 10 (paid the 10th)`, from: `${y}-${pad2(m)}-01`, to: `${y}-${pad2(m)}-10`, payDate: `${y}-${pad2(m)}-10` },
    { key: 'B', label: `11 – 20 (paid the 20th)`, from: `${y}-${pad2(m)}-11`, to: `${y}-${pad2(m)}-20`, payDate: `${y}-${pad2(m)}-20` },
  ];
}

function defaultCutoffHalf(payCycle, day) {
  if (payCycle === '15-30') return day <= 15 ? 'A' : 'B';
  return day <= 10 ? 'A' : 'B';
}

function seedProbationRecords() {

const Store = (function () {
  let state = load();

  function migrate(s) {
    (s.employees || []).forEach(e => {
      if (e.category === 'Manager' || e.category === 'Engineer') e.category = 'Admin';
      if (!e.employmentStatus) e.employmentStatus = 'Regular';
    });
    (s.candidates || []).forEach(c => {
      if (c.category === 'Manager' || c.category === 'Engineer') c.category = 'Admin';
    });
    if (!s.probationRecords) s.probationRecords = seedProbationRecords();
    if (!s.payrollOverrides) s.payrollOverrides = [];
    (s.probationRecords || []).forEach(p => {
      if (p.thirdMonthStatus === 'Meets Expectations') p.thirdMonthStatus = 'On Track for Regularization';
      if (p.sixthMonthStatus === 'Not Regularized') p.sixthMonthStatus = 'End of Contract';
    });
    return s;
  }

  function load() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) return migrate(JSON.parse(raw));
    } catch (e) { /* fall through to seed */ }
    const seeded = seedData();
    persist(seeded);
    return seeded;
  }

  function persist(s) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(s));
  }

  function save() { persist(state); }

  function resetToSeed() {
    state = seedData();
    save();
  }

  // ---- Employees ----
  function listEmployees() { return state.employees.slice(); }
  function getEmployee(id) { return state.employees.find(e => e.id === id); }
  function addEmployee(emp) {
    emp.id = genId('e');
    state.employees.push(emp);
    save();
    return emp;
  }
  function updateEmployee(id, patch) {
    const e = getEmployee(id);
    if (e) { Object.assign(e, patch); save(); }
    return e;
  }
  function deleteEmployee(id) {
    state.employees = state.employees.filter(e => e.id !== id);
    save();
  }

  // ---- Recruitment ----
  function listCandidates() { return state.candidates.slice(); }
  function getCandidate(id) { return state.candidates.find(c => c.id === id); }
  function addCandidate(cand) {
    cand.id = genId('c');
    cand.history = [{ date: todayISO(), stage: cand.stage, note: 'Candidate added to pipeline.' }];
    state.candidates.push(cand);
    save();
    return cand;
  }
  function moveCandidateStage(id, newStage, note) {
    const c = getCandidate(id);
    if (!c) return;
    c.stage = newStage;
    if (newStage.includes('Trade Test')) {
      c.tradeTestStart = todayISO();
      c.tradeTestEnd = addDays(todayISO(), newStage.startsWith('7') ? 7 : 3);
    }
    c.history.push({ date: todayISO(), stage: newStage, note: note || ('Moved to ' + newStage + '.') });
    save();
    return c;
  }
  function decideCandidate(id, decision, note) {
    const c = getCandidate(id);
    if (!c) return;
    c.decision = decision;
    c.stage = 'Decision';
    c.history.push({ date: todayISO(), stage: 'Decision', note: note || (decision + ' by Management/HR.') });
    save();
    return c;
  }
  function deleteCandidate(id) {
    state.candidates = state.candidates.filter(c => c.id !== id);
    save();
  }

  // ---- Disciplinary ----
  function listCases() { return state.disciplinaryCases.slice(); }
  function getCase(id) { return state.disciplinaryCases.find(c => c.id === id); }
  function addCase(nte) {
    nte.id = genId('d');
    nte.status = 'Notice Issued';
    nte.history = [{ date: nte.dateIssued, action: 'Notice Issued', note: nte.violation }];
    state.disciplinaryCases.push(nte);
    save();
    return nte;
  }
  function updateCase(id, patch, historyEntry) {
    const c = getCase(id);
    if (!c) return;
    Object.assign(c, patch);
    if (historyEntry) c.history.push(Object.assign({ date: todayISO() }, historyEntry));
    save();
    return c;
  }
  function deleteCase(id) {
    state.disciplinaryCases = state.disciplinaryCases.filter(c => c.id !== id);
    save();
  }

  // ---- Complaints ----
  function listComplaints() { return state.complaints.slice(); }
  function getComplaint(id) { return state.complaints.find(c => c.id === id); }
  function addComplaint(cp) {
    cp.id = genId('cp');
    state.complaints.push(cp);
    save();
    return cp;
  }
  function updateComplaint(id, patch) {
    const c = getComplaint(id);
    if (c) { Object.assign(c, patch); save(); }
    return c;
  }
  function deleteComplaint(id) {
    state.complaints = state.complaints.filter(c => c.id !== id);
    save();
  }

  // ---- Attendance ----
  function listAttendance() { return state.attendance.slice(); }
  function attendanceForDate(date) { return state.attendance.filter(a => a.date === date); }
  function attendanceInRange(from, to) { return state.attendance.filter(a => a.date >= from && a.date <= to); }
  function addAttendance(rec) {
    rec.id = genId('a');
    state.attendance.push(rec);
    save();
    return rec;
  }
  function updateAttendance(id, patch) {
    const a = state.attendance.find(x => x.id === id);
    if (a) { Object.assign(a, patch); save(); }
    return a;
  }
  function deleteAttendance(id) {
    state.attendance = state.attendance.filter(a => a.id !== id);
    save();
  }

  // ---- Probation / Regularization ----
  function listProbations() { return state.probationRecords.slice(); }
  function getProbation(id) { return state.probationRecords.find(p => p.id === id); }
  function getProbationByEmployee(employeeId) { return state.probationRecords.find(p => p.employeeId === employeeId); }
  function addProbation(rec) {
    rec.id = genId('pr');
    state.probationRecords.push(rec);
    save();
    return rec;
  }
  function updateProbation(id, patch) {
    const p = getProbation(id);
    if (p) { Object.assign(p, patch); save(); }
    return p;
  }
  function deleteProbation(id) {
    state.probationRecords = state.probationRecords.filter(p => p.id !== id);
    save();
  }

  // ---- Payroll overrides (editable "days present" per employee per cutoff) ----
  function getPayrollOverride(employeeId, cutoffFrom) {
    return state.payrollOverrides.find(o => o.employeeId === employeeId && o.cutoffFrom === cutoffFrom);
  }
  function setPayrollOverride(employeeId, cutoffFrom, daysPresent) {
    const existing = getPayrollOverride(employeeId, cutoffFrom);
    if (existing) { existing.daysPresent = daysPresent; }
    else { state.payrollOverrides.push({ id: genId('po'), employeeId, cutoffFrom, daysPresent }); }
    save();
  }

  // ---- Deductions ----
  function listDeductions() { return state.deductions.slice(); }
  function deductionsInRange(from, to) { return state.deductions.filter(d => d.date >= from && d.date <= to); }
  function addDeduction(d) {
    d.id = genId('ded');
    state.deductions.push(d);
    save();
    return d;
  }
  function deleteDeduction(id) {
    state.deductions = state.deductions.filter(d => d.id !== id);
    save();
  }

  return {
    resetToSeed,
    listEmployees, getEmployee, addEmployee, updateEmployee, deleteEmployee,
    listCandidates, getCandidate, addCandidate, moveCandidateStage, decideCandidate, deleteCandidate,
    listCases, getCase, addCase, updateCase, deleteCase,
    listComplaints, getComplaint, addComplaint, updateComplaint, deleteComplaint,
    listAttendance, attendanceForDate, attendanceInRange, addAttendance, updateAttendance, deleteAttendance,
    listDeductions, deductionsInRange, addDeduction, deleteDeduction,
    listProbations, getProbation, getProbationByEmployee, addProbation, updateProbation, deleteProbation,
    getPayrollOverride, setPayrollOverride,
  };
})();

<script>
/* ================= js/app.js ================= */
/* App shell: router + shared UI helpers. Views register themselves on window.Views. */

window.Views = window.Views || {};

function qs(sel, root) { return (root || document).querySelector(sel); }
function qsa(sel, root) { return Array.from((root || document).querySelectorAll(sel)); }

function escapeHtml(s) {
  if (s === null || s === undefined) return '';
  return String(s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}

function toast(msg) {
  const old = qs('.toast');
  if (old) old.remove();
  const el = document.createElement('div');
  el.className = 'toast';
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 2600);
}

function closeModal() {
  const bd = qs('.modal-backdrop');
  if (bd) bd.remove();
}

function openModal(innerHtml, onMount) {
  closeModal();
  closeDrawer();
  const bd = document.createElement('div');
  bd.className = 'modal-backdrop';
  bd.addEventListener('mousedown', function (e) { if (e.target === bd) closeModal(); });
  bd.innerHTML = '<div class="modal-wrap"><div class="modal">' +
    '<button class="modal-close" data-close-modal>&times;</button>' + innerHtml + '</div></div>';
  document.body.appendChild(bd);
  qs('[data-close-modal]', bd).addEventListener('click', closeModal);
  if (onMount) onMount(bd);
  return bd;
}

function closeDrawer() {
  const dr = qs('.drawer');
  const bg = qs('.drawer-backdrop');
  if (dr) dr.remove();
  if (bg) bg.remove();
}

function openDrawer(innerHtml, onMount) {
  closeDrawer();
  closeModal();
  const bg = document.createElement('div');
  bg.className = 'drawer-backdrop';
  bg.addEventListener('click', closeDrawer);
  document.body.appendChild(bg);
  const dr = document.createElement('div');
  dr.className = 'drawer';
  dr.innerHTML = innerHtml;
  document.body.appendChild(dr);
  if (onMount) onMount(dr);
  return dr;
}

function employeeOptions(selectedId, categoryFilter) {
  let emps = Store.listEmployees();
  if (categoryFilter) emps = emps.filter(e => e.category === categoryFilter);
  return emps.map(e => '<option value="' + e.id + '"' + (e.id === selectedId ? ' selected' : '') + '>' +
    escapeHtml(e.name) + ' (' + e.category + ')</option>').join('');
}

function employeeName(id) {
  const e = Store.getEmployee(id);
  return e ? e.name : '—';
}

function caseStatusBadge(status) {
  const map = {
    'Notice Issued': 'badge-orange',
    'Awaiting Response': 'badge-yellow',
    'Under Investigation': 'badge-blue',
    'Resolved': 'badge-green',
    'Escalated': 'badge-red',
  };
  return '<span class="badge ' + (map[status] || 'badge-gray') + '">' + escapeHtml(status) + '</span>';
}

function complaintStatusBadge(status) {
  const map = {
    'Open': 'badge-red',
    'In Progress': 'badge-yellow',
    'Resolved': 'badge-green',
    'Closed': 'badge-gray',
  };
  return '<span class="badge ' + (map[status] || 'badge-gray') + '">' + escapeHtml(status) + '</span>';
}

function priorityBadge(priority) {
  const map = { High: 'badge-red', Medium: 'badge-yellow', Low: 'badge-gray' };
  return '<span class="badge ' + (map[priority] || 'badge-gray') + '">' + escapeHtml(priority) + '</span>';
}

function employmentStatusBadge(status) {
  const map = { Regular: 'badge-blue', Probationary: 'badge-yellow' };
  return '<span class="badge ' + (map[status] || 'badge-gray') + '">' + escapeHtml(status || '—') + '</span>';
}

function daysBetween(fromISO, toISO) {
  return Math.round((new Date(toISO + 'T00:00:00') - new Date(fromISO + 'T00:00:00')) / 86400000);
}

function employeeStatusDot(status) {
  const map = { Active: 'on', 'On Leave': 'late', Off: 'off', Terminated: 'absent' };
  return '<span class="status-dot ' + (map[status] || '') + '">' + escapeHtml(status) + '</span>';
}

const ROUTES = ['overview', 'staff', 'recruitment', 'probation', 'disciplinary', 'attendance', 'payroll', 'complaints'];

function currentRoute() {
  const h = (location.hash || '').replace('#', '').split('/')[0];
  return ROUTES.includes(h) ? h : 'overview';
}

function setActiveNav(route) {
  qsa('.nav-item').forEach(a => {
    a.classList.toggle('active', a.dataset.route === route);
  });
}

function render() {
  closeModal();
  closeDrawer();
  const route = currentRoute();
  setActiveNav(route);
  const main = qs('#main-content');
  main.innerHTML = '';
  const view = window.Views[route];
  if (view && view.render) {
    view.render(main);
  } else {
    main.innerHTML = '<div class="empty">Not found.</div>';
  }
}

(function () {
  qsa('.nav-item').forEach(a => {
    a.addEventListener('click', function () {
      location.hash = '#' + a.dataset.route;
    });
  });
  window.addEventListener('hashchange', render);
  render();
})();

</script>

<script>
/* ================= js/views/overview.js ================= */
window.Views.overview = {
  render(main) {
    const employees = Store.listEmployees();
    const candidates = Store.listCandidates();
    const cases = Store.listCases();
    const complaints = Store.listComplaints();
    const today = todayISO();
    const todayAttendance = Store.attendanceForDate(today);

    const activeEmployees = employees.filter(e => e.status === 'Active').length;
    const byCategory = CATEGORIES.map(cat => ({
      cat, count: employees.filter(e => e.category === cat).length
    }));

    const openCandidates = candidates.filter(c => c.stage !== 'Decision').length;
    const openCases = cases.filter(c => c.status !== 'Resolved').length;
    const openComplaints = complaints.filter(c => c.status === 'Open' || c.status === 'In Progress').length;

    const present = todayAttendance.filter(a => a.status === 'Present' || a.status === 'Late').length;

    const upcomingTradeTests = candidates
      .filter(c => c.tradeTestEnd && c.tradeTestEnd >= today)
      .sort((a, b) => a.tradeTestEnd.localeCompare(b.tradeTestEnd))
      .slice(0, 5);

    const recentCases = cases.slice().sort((a, b) => b.dateIssued.localeCompare(a.dateIssued)).slice(0, 4);

          <div class="kpi-sub">of ${cases.length} total</div>
        </div>
        <div class="kpi-card">
          <div class="kpi-label">Open Complaints</div>
          <div class="kpi-value ${openComplaints ? 'red' : ''}">${openComplaints}</div>
          <div class="kpi-sub">of ${complaints.length} total</div>

      </div>

      <div class="two-col">
        <div>
          <div class="panel">
            <div class="panel-head">
              <h3>Headcount by Category</h3>
            </div>
            <table>
              <thead><tr><th>Category</th><th class="num">Employees</th><th>Roles</th></tr></thead>
              <tbody>
                ${byCategory.map(b => `
                  <tr>
                    <td class="name">${b.cat}</td>
                    <td class="num">${b.count}</td>
                    <td class="dim">${escapeHtml(employees.filter(e => e.category === b.cat).map(e => e.position).join(', ') || '—')}</td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          </div>

          <div class="section-title">Recent Disciplinary Cases</div>
          <div class="panel">
            ${recentCases.length ? `
            <table>
              <thead><tr><th>Employee</th><th>Violation</th><th>Status</th><th>Date Issued</th></tr></thead>
              <tbody>
                ${recentCases.map(c => `
                  <tr>
                    <td class="name">${escapeHtml(employeeName(c.employeeId))}</td>
                    <td class="dim">${escapeHtml(c.violation)}</td>
                    <td>${caseStatusBadge(c.status)}</td>
                    <td class="dim">${fmtDate(c.dateIssued)}</td>
                  </tr>
                `).join('')}
              </tbody>
            </table>` : '<div class="empty">No disciplinary cases on file.</div>'}
          </div>
        </div>

        <div>
          <div class="panel">
            <div class="panel-head"><h3>Upcoming / Active Trade Tests</h3></div>
            ${upcomingTradeTests.length ? `
            <table>
              <thead><tr><th>Candidate</th><th>Ends</th></tr></thead>
              <tbody>
                ${upcomingTradeTests.map(c => `
                  <tr>
                    <td class="name">${escapeHtml(c.name)}<div class="dim" style="font-size:11px;">${escapeHtml(c.positionAppliedFor)}</div></td>
                    <td class="dim">${fmtDate(c.tradeTestEnd)}</td>
                  </tr>
                `).join('')}
              </tbody>
            </table>` : '<div class="empty">No active trade tests.</div>'}
          </div>

          <div class="section-title">Recent Complaints</div>
          <div class="panel">
            ${recentComplaints.length ? `
            <table>
              <thead><tr><th>Customer</th><th>Status</th></tr></thead>
              <tbody>
                ${recentComplaints.map(c => `
                  <tr>
                    <td class="name">${escapeHtml(c.customerName)}<div class="dim" style="font-size:11px;">${fmtDate(c.dateReceived)}</div></td>
                    <td>${complaintStatusBadge(c.status)}</td>
                  </tr>
                `).join('')}
