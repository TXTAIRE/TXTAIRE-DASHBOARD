<script>
/* ================= js/views/staff.js ================= */
window.Views.staff = (function () {
  let filterCategory = 'All';
  let filterStatus = 'All';
  let filterEmployment = 'All';

  function renderList(main) {
    const all = Store.listEmployees();
    let rows = all.slice();
    if (filterCategory !== 'All') rows = rows.filter(e => e.category === filterCategory);
    if (filterStatus !== 'All') rows = rows.filter(e => e.status === filterStatus);
    if (filterEmployment !== 'All') rows = rows.filter(e => e.employmentStatus === filterEmployment);
    rows.sort((a, b) => a.name.localeCompare(b.name));

    const activeCount = all.filter(e => e.status === 'Active').length;

    main.innerHTML = `
      <div class="crumb">HR</div>
      <div class="page-head">
        <div>
          <h1 class="page-title">Employees</h1>
          <div class="page-sub">Centralized employee records for Admin, HR, and Technician staff.</div>
        </div>
        <button class="btn btn-primary" id="btn-add-employee">+ Add employee</button>
      </div>

      <div class="filters">
        <div class="field">
          <label>Category</label>
          <div class="seg" id="seg-category">
            ${['All'].concat(CATEGORIES).map(c => `<button data-val="${c}" class="${filterCategory === c ? 'active' : ''}">${c}</button>`).join('')}
          </div>
        </div>
        <div class="field">
          <label>Status</label>
          <div class="seg" id="seg-status">
            ${['All', 'Active', 'On Leave', 'Off', 'Terminated'].map(s => `<button data-val="${s}" class="${filterStatus === s ? 'active' : ''}">${s}</button>`).join('')}
          </div>
        </div>
        <div class="field">
          <label>Employment</label>
          <div class="seg" id="seg-employment">
            ${['All', 'Regular', 'Probationary'].map(s => `<button data-val="${s}" class="${filterEmployment === s ? 'active' : ''}">${s}</button>`).join('')}
          </div>
        </div>
      </div>

      <div class="page-sub" style="margin-bottom:10px;">${all.length} employees · ${activeCount} active</div>

      <div class="panel">
        ${rows.length ? `
        <table>
          <thead>
            <tr>
              <th>Name</th><th>Category</th><th>Position</th><th>Status</th><th>Employment</th>
              <th>Rate</th><th>Allowance</th><th>Payday</th><th></th>
            </tr>
          </thead>
          <tbody>
            ${rows.map(e => `
              <tr data-id="${e.id}">
                <td class="name row-link" data-open="${e.id}">${escapeHtml(e.name)}</td>
                <td><span class="badge badge-gray">${e.category}</span></td>
                <td class="dim">${escapeHtml(e.position)}</td>
                <td>${employeeStatusDot(e.status)}</td>
                <td>${employmentStatusBadge(e.employmentStatus)}</td>
                <td class="dim">${e.payType === 'Daily' ? fmtMoney(e.rate) + '/day' : fmtMoney(e.rate) + '/cutoff'}</td>
                <td class="dim">${(e.allowancePerDay || e.fixedAllowance) ? [e.allowancePerDay ? fmtMoney(e.allowancePerDay) + '/day' : null, e.fixedAllowance ? fmtMoney(e.fixedAllowance) + '/cutoff' : null].filter(Boolean).join(' + ') : '—'}</td>
                <td class="dim">${PAY_CYCLES[e.payCycle] ? PAY_CYCLES[e.payCycle].cutoffLabels.join(' & ') : '—'}</td>
                <td><button class="link-btn" data-edit="${e.id}">Edit →</button></td>
              </tr>
            `).join('')}
          </tbody>
        </table>` : '<div class="empty">No employees match these filters.</div>'}
      </div>
    `;

    qs('#btn-add-employee', main).addEventListener('click', () => openEmployeeModal(main, null));
    qsa('#seg-category button', main).forEach(b => b.addEventListener('click', () => { filterCategory = b.dataset.val; renderList(main); }));
    qsa('#seg-status button', main).forEach(b => b.addEventListener('click', () => { filterStatus = b.dataset.val; renderList(main); }));
    qsa('#seg-employment button', main).forEach(b => b.addEventListener('click', () => { filterEmployment = b.dataset.val; renderList(main); }));
    qsa('[data-edit]', main).forEach(b => b.addEventListener('click', () => openEmployeeModal(main, b.dataset.edit)));
    qsa('[data-open]', main).forEach(b => b.addEventListener('click', () => openEmployeeDetail(main, b.dataset.open)));
  }

  function openEmployeeDetail(main, id) {
    const e = Store.getEmployee(id);
    if (!e) return;
    const cases = Store.listCases().filter(c => c.employeeId === id);
    openDrawer(`
      <h2>${escapeHtml(e.name)}</h2>
      <div class="page-sub" style="margin-bottom:14px;">${e.category} · ${escapeHtml(e.position)}</div>
      <div class="kpi-row" style="grid-template-columns:1fr 1fr;">
        <div class="kpi-card"><div class="kpi-label">Status</div><div class="kpi-value" style="font-size:16px;">${employeeStatusDot(e.status)}</div></div>
        <div class="kpi-card"><div class="kpi-label">Employment</div><div class="kpi-value" style="font-size:16px;">${employmentStatusBadge(e.employmentStatus)}</div></div>
      </div>
      <div class="page-sub" style="margin-top:10px;">Date hired: ${fmtDate(e.dateHired)}</div>
      <div class="section-title" style="margin-top:18px;">Contact</div>
      <div class="page-sub">Phone: ${escapeHtml(e.phone || '—')}<br/>Email: ${escapeHtml(e.email || '—')}</div>
      <div class="section-title">Pay</div>
      <div class="page-sub">
        Rate: ${e.payType === 'Daily' ? fmtMoney(e.rate) + ' / day' : fmtMoney(e.rate) + ' / cutoff'}<br/>
        ${e.allowancePerDay ? 'Allowance: ' + fmtMoney(e.allowancePerDay) + ' / day<br/>' : ''}
        ${e.fixedAllowance ? 'Fixed allowance: ' + fmtMoney(e.fixedAllowance) + ' / cutoff<br/>' : ''}
        Payday: ${PAY_CYCLES[e.payCycle] ? PAY_CYCLES[e.payCycle].cutoffLabels.join(' & ') : '—'}
      </div>
      ${e.notes ? `<div class="section-title">Notes</div><div class="page-sub">${escapeHtml(e.notes)}</div>` : ''}
      <div class="section-title">Disciplinary History</div>
      ${cases.length ? `<div class="timeline">${cases.map(c => `
        <div class="tl-item"><div class="tl-dot"></div><div class="tl-body">
          <div class="tl-title">${escapeHtml(c.violation)}</div>
          <div class="tl-meta">${fmtDate(c.dateIssued)} · ${c.status}</div>
        </div></div>
      `).join('')}</div>` : '<div class="page-sub">No disciplinary cases on file.</div>'}
      <div class="modal-actions" style="margin-top:20px;">
        <button class="btn btn-ghost" id="drawer-edit">Edit</button>
      </div>
    `, (dr) => {
      qs('#drawer-edit', dr).addEventListener('click', () => { closeDrawer(); openEmployeeModal(main, id); });
    });
  }

  function openEmployeeModal(main, id) {
    const editing = id ? Store.getEmployee(id) : null;
    const e = editing || { name: '', category: 'Admin', position: '', status: 'Active', employmentStatus: 'Regular', dateHired: '', phone: '', email: '', payType: 'Monthly', rate: '', allowancePerDay: 0, fixedAllowance: 0, payCycle: '10-20', notes: '' };

    openModal(`
      <h2>${editing ? 'Edit employee' : 'Add employee'}</h2>
      <div class="modal-sub">${editing ? 'Update employee record.' : 'Add a new employee to the centralized HR database.'}</div>
      <form id="employee-form">
        <div class="modal-grid">
          <div class="field full"><label>Full name</label><input name="name" required value="${escapeHtml(e.name)}" /></div>
          <div class="field"><label>Category</label>
            <select name="category">${CATEGORIES.map(c => `<option ${c === e.category ? 'selected' : ''}>${c}</option>`).join('')}</select>
          </div>
          <div class="field"><label>Position</label><input name="position" required value="${escapeHtml(e.position)}" /></div>
          <div class="field"><label>Status</label>
            <select name="status">${['Active', 'On Leave', 'Off', 'Terminated'].map(s => `<option ${s === e.status ? 'selected' : ''}>${s}</option>`).join('')}</select>
          </div>
          <div class="field"><label>Employment status</label>
            <select name="employmentStatus">${['Regular', 'Probationary'].map(s => `<option ${s === e.employmentStatus ? 'selected' : ''}>${s}</option>`).join('')}</select>
          </div>
          <div class="field"><label>Date hired</label><input type="date" name="dateHired" value="${e.dateHired}" /></div>
          <div class="field"><label>Phone</label><input name="phone" value="${escapeHtml(e.phone)}" /></div>
          <div class="field"><label>Email</label><input type="email" name="email" value="${escapeHtml(e.email)}" /></div>
          <div class="field"><label>Pay cycle</label>
            <select name="payCycle">
              <option value="10-20" ${e.payCycle === '10-20' ? 'selected' : ''}>10th &amp; 20th (Engineers/Managers/Admins)</option>
              <option value="15-30" ${e.payCycle === '15-30' ? 'selected' : ''}>15th &amp; 30th/31st (Technicians)</option>
            </select>
          </div>
          <div class="field"><label>Pay type</label>
            <select name="payType">${['Monthly', 'Daily'].map(p => `<option ${p === e.payType ? 'selected' : ''}>${p}</option>`).join('')}</select>
          </div>
          <div class="field"><label>Rate (PHP)</label><input type="number" name="rate" min="0" step="0.01" value="${e.rate}" /></div>
          <div class="field"><label>Allowance / day (PHP)</label><input type="number" name="allowancePerDay" min="0" step="0.01" value="${e.allowancePerDay || 0}" /></div>
          <div class="field"><label>Fixed allowance / cutoff (PHP)</label><input type="number" name="fixedAllowance" min="0" step="0.01" value="${e.fixedAllowance || 0}" /></div>
          <div class="field full"><label>Notes</label><textarea name="notes" rows="2">${escapeHtml(e.notes || '')}</textarea></div>
        </div>
        <div class="modal-actions">
          ${editing ? '<button type="button" class="btn btn-danger" id="btn-del-emp">Delete</button>' : ''}
          <button type="button" class="btn btn-ghost" data-close-modal>Cancel</button>
          <button type="submit" class="btn btn-primary">${editing ? 'Save changes' : 'Add employee'}</button>
        </div>
      </form>
    `, (bd) => {
      qs('#employee-form', bd).addEventListener('submit', (ev) => {
        ev.preventDefault();
        const fd = new FormData(ev.target);
        const patch = {
          name: fd.get('name').trim(),
          category: fd.get('category'),
          position: fd.get('position').trim(),
          status: fd.get('status'),
          employmentStatus: fd.get('employmentStatus'),
          dateHired: fd.get('dateHired'),
          phone: fd.get('phone').trim(),
          email: fd.get('email').trim(),
          payCycle: fd.get('payCycle'),
          payType: fd.get('payType'),
          rate: Number(fd.get('rate')) || 0,
          allowancePerDay: Number(fd.get('allowancePerDay')) || 0,
          fixedAllowance: Number(fd.get('fixedAllowance')) || 0,
          notes: fd.get('notes').trim(),
        };
        if (editing) {
          Store.updateEmployee(editing.id, patch);
          toast('Employee updated.');
        } else {
          Store.addEmployee(patch);
          toast('Employee added.');
        }
        closeModal();
        renderList(main);
      });
      const delBtn = qs('#btn-del-emp', bd);
      if (delBtn) delBtn.addEventListener('click', () => {
        if (confirm('Delete ' + editing.name + '? This cannot be undone.')) {
          Store.deleteEmployee(editing.id);
          closeModal();
          toast('Employee deleted.');
          renderList(main);
        }
      });
    });
  }

  return { render: renderList };
})();

</script>

<script>
/* ================= js/views/recruitment.js ================= */
window.Views.recruitment = (function () {
  let filterCategory = 'All';

  const MACRO_COLUMNS = ['Screening', 'Phone Interview', 'Interview / Agreement', 'Trade Test', 'Evaluation', 'Decision'];

  function macroStage(stage) {
    if (stage === 'Screening') return 'Screening';
    if (stage === 'Phone Interview') return 'Phone Interview';
    if (stage === 'Face-to-Face Interview' || stage === 'Candidate Agreement') return 'Interview / Agreement';
    if (stage === '3-Day Trade Test' || stage === '7-Day Trade Test') return 'Trade Test';
    if (stage === 'Evaluation') return 'Evaluation';
    return 'Decision';
  }

  function columnsFor() {
    if (filterCategory === 'All') return MACRO_COLUMNS;
    return stagesFor(filterCategory);
  }

  function candidateColumn(c) {
    return filterCategory === 'All' ? macroStage(c.stage) : c.stage;
  }

  function renderBoard(main) {
    const all = Store.listCandidates();
    const rows = filterCategory === 'All' ? all : all.filter(c => c.category === filterCategory);
    const cols = columnsFor();
    const today = todayISO();

    main.innerHTML = `
      <div class="crumb">HR</div>
      <div class="page-head">
        <div>
          <h1 class="page-title">Recruitment</h1>
          <div class="page-sub">Application Screening → Interview / Assessment → Trade Test → Evaluation → Final Decision. Technicians follow a 7-day trade test; Admin, HR, and Engineers follow a 3-day trade test.</div>
        </div>
        <button class="btn btn-primary" id="btn-add-candidate">+ Add candidate</button>
      </div>

      <div class="filters">
        <div class="field">
          <label>Category</label>
          <div class="seg" id="seg-category">
            ${['All'].concat(CATEGORIES).map(c => `<button data-val="${c}" class="${filterCategory === c ? 'active' : ''}">${c}</button>`).join('')}
          </div>
        </div>
      </div>

      <div class="kanban">
        ${cols.map(col => {
          const inCol = rows.filter(c => candidateColumn(c) === col && !(col === 'Decision' && c.decision));
          const decided = col === 'Decision' ? rows.filter(c => c.decision) : [];
          const cardsAll = col === 'Decision' ? inCol.concat(decided) : inCol;
          return `
          <div class="kanban-col">
            <div class="kanban-col-head"><span>${col}</span><span class="count">${cardsAll.length}</span></div>
            <div class="kanban-cards">
              ${cardsAll.map(c => `
                <div class="kcard" data-open="${c.id}">
                  <div class="kname">${escapeHtml(c.name)}</div>
                  <div class="kmeta">${c.category} · ${escapeHtml(c.positionAppliedFor)}</div>
                  ${c.tradeTestEnd && !c.decision ? `<div class="kmeta" style="margin-top:4px;color:${c.tradeTestEnd < today ? 'var(--yellow)' : 'var(--text-faint)'};">Trade test ends ${fmtDate(c.tradeTestEnd)}</div>` : ''}
                  ${c.decision ? `<div style="margin-top:6px;">${decisionBadge(c.decision)}</div>` : ''}
                </div>
              `).join('') || '<div class="page-sub" style="font-size:11.5px;padding:4px 2px;">No candidates.</div>'}
            </div>
          </div>
        `; }).join('')}
      </div>
    `;

    qs('#btn-add-candidate', main).addEventListener('click', () => openCandidateForm(main));
    qsa('#seg-category button', main).forEach(b => b.addEventListener('click', () => { filterCategory = b.dataset.val; renderBoard(main); }));
    qsa('[data-open]', main).forEach(el => el.addEventListener('click', () => openCandidateDetail(main, el.dataset.open)));
  }

  function decisionBadge(d) {
    const map = { Hired: 'badge-green', Rejected: 'badge-red', 'On Hold': 'badge-yellow' };
    return `<span class="badge ${map[d] || 'badge-gray'}">${d}</span>`;
  }

  function openCandidateDetail(main, id) {
    const c = Store.getCandidate(id);
    if (!c) return;
    const stages = stagesFor(c.category);
    const idx = stages.indexOf(c.stage);
    const next = idx >= 0 && idx < stages.length - 1 ? stages[idx + 1] : null;

    openDrawer(`
      <h2>${escapeHtml(c.name)}</h2>
      <div class="page-sub" style="margin-bottom:10px;">${c.category} · ${escapeHtml(c.positionAppliedFor)}</div>
      <div style="margin-bottom:14px;">
        <span class="badge badge-orange">${escapeHtml(c.stage)}</span>
        ${c.decision ? decisionBadge(c.decision) : ''}
      </div>
      <div class="page-sub">Applied: ${fmtDate(c.appliedDate)}<br/>Phone: ${escapeHtml(c.phone || '—')}<br/>Email: ${escapeHtml(c.email || '—')}</div>
      ${c.tradeTestStart ? `<div class="page-sub" style="margin-top:8px;">Trade test: ${fmtDate(c.tradeTestStart)} → ${fmtDate(c.tradeTestEnd)}</div>` : ''}

      <div class="section-title">Timeline</div>
      <div class="timeline">
        ${c.history.slice().reverse().map(h => `
          <div class="tl-item"><div class="tl-dot"></div><div class="tl-body">
            <div class="tl-title">${escapeHtml(h.stage)}</div>
            <div class="tl-meta">${fmtDate(h.date)}</div>
            <div class="tl-text">${escapeHtml(h.note)}</div>
          </div></div>
        `).join('')}
      </div>

      ${!c.decision ? `
      <div class="modal-actions" style="margin-top:20px; justify-content:flex-start; flex-wrap:wrap;">
        ${next ? `<button class="btn btn-primary btn-sm" id="btn-advance">Move to: ${next} →</button>` : ''}
        ${c.stage === 'Evaluation' ? `
          <button class="btn btn-ghost btn-sm" id="btn-hire" style="color:var(--green);border-color:var(--green);">Hire</button>
          <button class="btn btn-ghost btn-sm" id="btn-hold">Hold</button>
          <button class="btn btn-danger btn-sm" id="btn-reject">Reject</button>
        ` : ''}
      </div>` : ''}
      <div class="modal-actions" style="margin-top:10px;">
        <button class="btn btn-ghost btn-sm" id="btn-del-candidate">Remove candidate</button>
      </div>
    `, (dr) => {
      const adv = qs('#btn-advance', dr);
      if (adv) adv.addEventListener('click', () => {
        Store.moveCandidateStage(c.id, next);
        toast('Moved to ' + next + '.');
        closeDrawer();
        renderBoard(main);
      });
      const hire = qs('#btn-hire', dr);
      if (hire) hire.addEventListener('click', () => {
        Store.decideCandidate(c.id, 'Hired', 'Endorsed by HR and Department Head; approved by Management.');
        toast(c.name + ' marked as Hired.');
        closeDrawer();
        renderBoard(main);
      });
      const hold = qs('#btn-hold', dr);
      if (hold) hold.addEventListener('click', () => {
        Store.decideCandidate(c.id, 'On Hold', 'Placed on hold pending further review.');
        toast(c.name + ' placed on hold.');
        closeDrawer();
        renderBoard(main);
      });
      const rej = qs('#btn-reject', dr);
      if (rej) rej.addEventListener('click', () => {
        Store.decideCandidate(c.id, 'Rejected', 'Not recommended for hiring.');
        toast(c.name + ' marked as Rejected.');
        closeDrawer();
        renderBoard(main);
      });
      qs('#btn-del-candidate', dr).addEventListener('click', () => {
        if (confirm('Remove ' + c.name + ' from the pipeline?')) {
          Store.deleteCandidate(c.id);
          closeDrawer();
          toast('Candidate removed.');
          renderBoard(main);
        }
      });
    });
  }

  function openCandidateForm(main) {
    openModal(`
      <h2>Add candidate</h2>
      <div class="modal-sub">New candidates start at the Screening stage.</div>
      <form id="candidate-form">
        <div class="modal-grid">
          <div class="field full"><label>Full name</label><input name="name" required /></div>
          <div class="field"><label>Category</label>
            <select name="category">${CATEGORIES.map(c => `<option>${c}</option>`).join('')}</select>
          </div>
          <div class="field"><label>Position applied for</label><input name="positionAppliedFor" required /></div>
          <div class="field"><label>Phone</label><input name="phone" /></div>
          <div class="field"><label>Email</label><input type="email" name="email" /></div>
          <div class="field full"><label>Applied date</label><input type="date" name="appliedDate" value="${todayISO()}" /></div>
        </div>
        <div class="modal-actions">
          <button type="button" class="btn btn-ghost" data-close-modal>Cancel</button>
          <button type="submit" class="btn btn-primary">Add candidate</button>
        </div>
      </form>
    `, (bd) => {
      qs('#candidate-form', bd).addEventListener('submit', (ev) => {
        ev.preventDefault();
        const fd = new FormData(ev.target);
        Store.addCandidate({
          name: fd.get('name').trim(),
          category: fd.get('category'),
          positionAppliedFor: fd.get('positionAppliedFor').trim(),
          phone: fd.get('phone').trim(),
          email: fd.get('email').trim(),
          appliedDate: fd.get('appliedDate'),
          stage: 'Screening',
          decision: null,
          tradeTestStart: null,
          tradeTestEnd: null,
        });
        toast('Candidate added.');
        closeModal();
        renderBoard(main);
      });
    });
  }

  return { render: renderBoard };
})();

</script>

<script>
/* ================= js/views/probation.js ================= */
window.Views.probation = (function () {

  const THIRD_MONTH_OPTIONS = ['Pending', 'On Track for Regularization', 'Needs Improvement', 'Recommend End of Contract'];
  const SIXTH_MONTH_OPTIONS = ['Pending', 'Regularized', 'Extended', 'End of Contract'];

  function milestoneBadge(status) {
    const map = {
      'Pending': 'badge-gray',
      'On Track for Regularization': 'badge-green',
      'Needs Improvement': 'badge-yellow',
      'Recommend End of Contract': 'badge-red',
      'Regularized': 'badge-green',
      'Extended': 'badge-yellow',
      'End of Contract': 'badge-red',
    };
    return '<span class="badge ' + (map[status] || 'badge-gray') + '">' + escapeHtml(status) + '</span>';
  }

  function truncate(text, n) {
    if (!text) return '—';
    return text.length > n ? text.slice(0, n) + '…' : text;
  }

  function dueBadge(dueDate, status) {
    if (status !== 'Pending') return '';
    const diff = daysBetween(todayISO(), dueDate);
    if (diff < 0) return '<span class="badge badge-red">Overdue ' + Math.abs(diff) + 'd</span>';
    if (diff <= 14) return '<span class="badge badge-yellow">Due in ' + diff + 'd</span>';
    return '<span class="badge badge-gray">In ' + diff + 'd</span>';
  }

  function renderList(main) {
    const records = Store.listProbations();
    const rows = records.map(r => {
      const emp = Store.getEmployee(r.employeeId);
      const thirdDue = addMonths(r.startDate, 3);
      const sixthDue = addMonths(r.startDate, 6);
      return { r, emp, thirdDue, sixthDue };
    }).filter(row => row.emp);
    rows.sort((a, b) => a.thirdDue.localeCompare(b.thirdDue));

    const dueSoon3 = rows.filter(row => row.r.thirdMonthStatus === 'Pending' && daysBetween(todayISO(), row.thirdDue) <= 14);
    const dueSoon6 = rows.filter(row => row.r.sixthMonthStatus === 'Pending' && daysBetween(todayISO(), row.sixthDue) <= 14);
    const regularizedCount = rows.filter(row => row.r.sixthMonthStatus === 'Regularized').length;

    main.innerHTML = `
      <div class="crumb">HR</div>
      <div class="page-head">
        <div>
          <h1 class="page-title">Probation &amp; Regularization</h1>
          <div class="page-sub">Probationary employees are evaluated at the 3rd month and again at the 6th month, when a regularization decision is due. Track start dates and both milestones here.</div>
        </div>
        <button class="btn btn-primary" id="btn-add-probation">+ Track employee</button>
      </div>

      <div class="kpi-row">
        <div class="kpi-card"><div class="kpi-label">On Probation</div><div class="kpi-value">${rows.length}</div></div>
        <div class="kpi-card"><div class="kpi-label">3rd Month Due Soon</div><div class="kpi-value ${dueSoon3.length ? 'red' : ''}">${dueSoon3.length}</div><div class="kpi-sub">within 14 days or overdue</div></div>
        <div class="kpi-card"><div class="kpi-label">6th Month Due Soon</div><div class="kpi-value ${dueSoon6.length ? 'red' : ''}">${dueSoon6.length}</div><div class="kpi-sub">within 14 days or overdue</div></div>
        <div class="kpi-card"><div class="kpi-label">Regularized</div><div class="kpi-value green">${regularizedCount}</div></div>
      </div>

      <div class="panel">
        ${rows.length ? `
        <table>
          <thead>
            <tr>
              <th>Employee</th><th>Position</th><th>Start Date</th>
              <th>3rd Month Due</th><th>3rd Month Status</th><th>3rd Month Remarks</th>
              <th>6th Month Due (End of Probation)</th><th>6th Month Status</th><th>6th Month Remarks</th><th></th>
            </tr>
          </thead>
          <tbody>
            ${rows.map(row => `
              <tr>
                <td class="name row-link" data-open="${row.r.id}">${escapeHtml(row.emp.name)}</td>
                <td class="dim">${escapeHtml(row.emp.position)}</td>
                <td class="dim">${fmtDate(row.r.startDate)}</td>
                <td class="dim">${fmtDate(row.thirdDue)} ${dueBadge(row.thirdDue, row.r.thirdMonthStatus)}</td>
                <td>${milestoneBadge(row.r.thirdMonthStatus)}</td>
                <td class="dim" style="max-width:200px;">${escapeHtml(truncate(row.r.thirdMonthNotes, 60))}</td>
                <td class="dim">${fmtDate(row.sixthDue)} ${dueBadge(row.sixthDue, row.r.sixthMonthStatus)}</td>
                <td>${milestoneBadge(row.r.sixthMonthStatus)}</td>
                <td class="dim" style="max-width:200px;">${escapeHtml(truncate(row.r.sixthMonthNotes, 60))}</td>
                <td><button class="link-btn" data-open="${row.r.id}">Edit remarks →</button></td>
              </tr>
            `).join('')}
          </tbody>
        </table>` : '<div class="empty">No probationary employees are being tracked yet.</div>'}
      </div>
    `;

    qs('#btn-add-probation', main).addEventListener('click', () => openAddForm(main));
    qsa('[data-open]', main).forEach(el => el.addEventListener('click', () => openDetail(main, el.dataset.open)));
  }

  function openDetail(main, id) {
    const r = Store.getProbation(id);
    if (!r) return;
    const emp = Store.getEmployee(r.employeeId);
    const thirdDue = addMonths(r.startDate, 3);
    const sixthDue = addMonths(r.startDate, 6);

    openDrawer(`
      <h2>${escapeHtml(emp ? emp.name : 'Unknown employee')}</h2>
      <div class="page-sub" style="margin-bottom:14px;">${emp ? escapeHtml(emp.position) : ''}</div>
      <div class="page-sub">Probation start: ${fmtDate(r.startDate)}</div>

      <div class="section-title">3rd Month Evaluation — due ${fmtDate(thirdDue)}</div>
      <div class="page-sub" style="margin-bottom:10px;">Interim check-in: is this employee trending toward regularization or end of contract?</div>
      <div style="margin-bottom:10px;">${milestoneBadge(r.thirdMonthStatus)} ${dueBadge(thirdDue, r.thirdMonthStatus)}</div>
      ${r.thirdMonthNotes ? `<div class="page-sub" style="margin-bottom:10px;">${escapeHtml(r.thirdMonthNotes)}${r.thirdMonthEvaluatedDate ? ' (' + fmtDate(r.thirdMonthEvaluatedDate) + ')' : ''}</div>` : ''}
      <div class="modal-grid">
        <div class="field"><label>Result</label>
          <select id="third-status">
            ${THIRD_MONTH_OPTIONS.map(s => `<option ${s === r.thirdMonthStatus ? 'selected' : ''}>${s}</option>`).join('')}
          </select>
        </div>
        <div class="field"><label>Evaluated on</label><input type="date" id="third-date" value="${r.thirdMonthEvaluatedDate || todayISO()}" /></div>
        <div class="field full"><label>Remarks</label><textarea id="third-notes" rows="2" placeholder="Editable remarks — performance notes, reasons for the recommendation, etc.">${escapeHtml(r.thirdMonthNotes || '')}</textarea></div>
      </div>
      <div class="modal-actions" style="justify-content:flex-start;">
        <button class="btn btn-ghost btn-sm" id="btn-save-third">Save 3rd month result</button>
      </div>

      <div class="section-title">6th Month Decision — due ${fmtDate(sixthDue)}</div>
      <div class="page-sub" style="margin-bottom:10px;">Final decision at end of the probationary period: regularization or end of contract.</div>
      <div style="margin-bottom:10px;">${milestoneBadge(r.sixthMonthStatus)} ${dueBadge(sixthDue, r.sixthMonthStatus)}</div>
      ${r.sixthMonthNotes ? `<div class="page-sub" style="margin-bottom:10px;">${escapeHtml(r.sixthMonthNotes)}${r.sixthMonthEvaluatedDate ? ' (' + fmtDate(r.sixthMonthEvaluatedDate) + ')' : ''}</div>` : ''}
      <div class="modal-grid">
        <div class="field"><label>Decision</label>
          <select id="sixth-status">
            ${SIXTH_MONTH_OPTIONS.map(s => `<option ${s === r.sixthMonthStatus ? 'selected' : ''}>${s}</option>`).join('')}
          </select>
        </div>
        <div class="field"><label>Decided on</label><input type="date" id="sixth-date" value="${r.sixthMonthEvaluatedDate || todayISO()}" /></div>
        <div class="field full"><label>Remarks</label><textarea id="sixth-notes" rows="2" placeholder="Editable remarks — basis for regularization or end of contract.">${escapeHtml(r.sixthMonthNotes || '')}</textarea></div>
      </div>
      <div class="modal-actions" style="justify-content:flex-start;">
        <button class="btn btn-primary btn-sm" id="btn-save-sixth">Save decision &amp; remarks</button>
      </div>

      <div class="section-title">Finalize Employment Status</div>
      <div class="page-sub" style="margin-bottom:10px;">
        A deliberate, separate action — saving the decision above does <strong>not</strong> change the employee's status by itself.
        Current status: ${employmentStatusBadge(emp ? emp.employmentStatus : 'Probationary')}${emp && emp.status === 'Terminated' ? ' ' + employeeStatusDot(emp.status) : ''}
      </div>
      <div class="seg" id="seg-finalize">
        <button data-val="regular" class="${emp && emp.employmentStatus === 'Regular' ? 'active' : ''}">Regular</button>
        <button data-val="end" class="${emp && emp.status === 'Terminated' ? 'active' : ''}">End of Contract</button>
      </div>

      <div class="modal-actions" style="margin-top:16px;">
        <button class="btn btn-ghost btn-sm" id="btn-del-probation">Remove from tracking</button>
      </div>
    `, (dr) => {
      qs('#btn-save-third', dr).addEventListener('click', () => {
        Store.updateProbation(r.id, {
          thirdMonthStatus: qs('#third-status', dr).value,
          thirdMonthEvaluatedDate: qs('#third-date', dr).value,
          thirdMonthNotes: qs('#third-notes', dr).value.trim(),
        });
        toast('3rd month result saved.');
        closeDrawer();
        renderList(main);
      });
      qs('#btn-save-sixth', dr).addEventListener('click', () => {
        Store.updateProbation(r.id, {
          sixthMonthStatus: qs('#sixth-status', dr).value,
          sixthMonthEvaluatedDate: qs('#sixth-date', dr).value,
          sixthMonthNotes: qs('#sixth-notes', dr).value.trim(),
        });
        toast('6th month decision and remarks saved.');
        closeDrawer();
        renderList(main);
      });
      qsa('#seg-finalize button', dr).forEach(b => b.addEventListener('click', () => {
        if (!emp) return;
        if (b.dataset.val === 'regular') {
          if (confirm('Confirm regularizing ' + emp.name + '? This sets their employment status to Regular.')) {
            Store.updateEmployee(emp.id, { employmentStatus: 'Regular' });
            toast(emp.name + ' is now Regular.');
            closeDrawer();
            renderList(main);
          }
        } else {
          if (confirm('Confirm end of contract for ' + emp.name + '? This sets their status to Terminated on the Employees page.')) {
            Store.updateEmployee(emp.id, { status: 'Terminated' });
            toast(emp.name + '\'s contract has been ended.');
            closeDrawer();
            renderList(main);
          }
        }
      }));
      qs('#btn-del-probation', dr).addEventListener('click', () => {
        if (confirm('Remove this employee from probation tracking?')) {
          Store.deleteProbation(r.id);
          closeDrawer();
          toast('Removed from tracking.');
          renderList(main);
        }
      });
    });
  }

  function openAddForm(main) {
    const tracked = new Set(Store.listProbations().map(p => p.employeeId));
    const candidates = Store.listEmployees().filter(e => e.employmentStatus === 'Probationary' && !tracked.has(e.id));

    if (!candidates.length) {
      openModal(`
        <h2>Track employee</h2>
        <div class="modal-sub">Every current probationary employee is already being tracked. Set an employee's status to "Probationary" on the Employees page first.</div>
        <div class="modal-actions"><button type="button" class="btn btn-ghost" data-close-modal>Close</button></div>
      `);
      return;
    }

    openModal(`
      <h2>Track employee</h2>
      <div class="modal-sub">Start tracking a probationary employee's 3rd and 6th month evaluation.</div>
      <form id="probation-form">
        <div class="modal-grid">
          <div class="field full"><label>Employee</label>
            <select name="employeeId">${candidates.map(e => `<option value="${e.id}">${escapeHtml(e.name)} — ${escapeHtml(e.position)}</option>`).join('')}</select>
          </div>
          <div class="field full"><label>Probation start date</label><input type="date" name="startDate" value="${todayISO()}" required /></div>
        </div>
        <div class="modal-actions">
          <button type="button" class="btn btn-ghost" data-close-modal>Cancel</button>
          <button type="submit" class="btn btn-primary">Start tracking</button>
        </div>
      </form>
    `, (bd) => {
      qs('#probation-form', bd).addEventListener('submit', (ev) => {
        ev.preventDefault();
        const fd = new FormData(ev.target);
        Store.addProbation({
          employeeId: fd.get('employeeId'),
          startDate: fd.get('startDate'),
          thirdMonthStatus: 'Pending', thirdMonthEvaluatedDate: null, thirdMonthNotes: '',
          sixthMonthStatus: 'Pending', sixthMonthEvaluatedDate: null, sixthMonthNotes: '',
        });
        toast('Now tracking probation period.');
        closeModal();
        renderList(main);
      });
    });
  }

  return { render: renderList };
})();

</script>

<script>
/* ================= js/views/disciplinary.js ================= */
window.Views.disciplinary = (function () {
  let filterStatus = 'Open';

  function renderList(main) {
    const all = Store.listCases();
    let rows = all.slice();
    if (filterStatus === 'Open') rows = rows.filter(c => c.status !== 'Resolved');
    else if (filterStatus !== 'All') rows = rows.filter(c => c.status === filterStatus);
    rows.sort((a, b) => b.dateIssued.localeCompare(a.dateIssued));

    main.innerHTML = `
      <div class="crumb">HR</div>
      <div class="page-head">
        <div>
          <h1 class="page-title">Disciplinary / NTE</h1>
          <div class="page-sub">Notice to Explain issuance, employee response, investigation, and resolution — with a full audit trail per case.</div>
        </div>
        <button class="btn btn-primary" id="btn-issue-nte">+ Issue NTE</button>
      </div>

      <div class="filters">
        <div class="field">
          <label>Status</label>
          <div class="seg" id="seg-status">
            ${['Open', 'All', 'Notice Issued', 'Under Investigation', 'Resolved', 'Escalated'].map(s => `<button data-val="${s}" class="${filterStatus === s ? 'active' : ''}">${s}</button>`).join('')}
          </div>
        </div>
      </div>

      <div class="panel">
        ${rows.length ? `
        <table>
          <thead><tr><th>Employee</th><th>Violation</th><th>Status</th><th>Issued</th><th>Response Due</th><th></th></tr></thead>
          <tbody>
            ${rows.map(c => `
              <tr>
                <td class="name row-link" data-open="${c.id}">${escapeHtml(employeeName(c.employeeId))}</td>
                <td class="dim">${escapeHtml(c.violation)}</td>
                <td>${caseStatusBadge(c.status)}</td>
                <td class="dim">${fmtDate(c.dateIssued)}</td>
                <td class="dim">${fmtDate(c.responseDueDate)}</td>
                <td><button class="link-btn" data-open="${c.id}">View →</button></td>
              </tr>
            `).join('')}
          </tbody>
        </table>` : '<div class="empty">No cases match this filter.</div>'}
      </div>
    `;

    qs('#btn-issue-nte', main).addEventListener('click', () => openNteForm(main));
    qsa('#seg-status button', main).forEach(b => b.addEventListener('click', () => { filterStatus = b.dataset.val; renderList(main); }));
    qsa('[data-open]', main).forEach(el => el.addEventListener('click', () => openCaseDetail(main, el.dataset.open)));
  }

  function openCaseDetail(main, id) {
    const c = Store.getCase(id);
    if (!c) return;

    let actionHtml = '';
    if (c.status === 'Notice Issued') {
      actionHtml = `
        <div class="section-title">Record Employee Response</div>
        <div class="field full"><textarea id="resp-text" rows="3" placeholder="Employee's written explanation..."></textarea></div>
        <div class="modal-actions" style="justify-content:flex-start;">
          <button class="btn btn-primary btn-sm" id="btn-log-response">Save response</button>
          <button class="btn btn-danger btn-sm" id="btn-escalate">Escalate</button>
        </div>
      `;
    } else if (c.status === 'Under Investigation') {
      actionHtml = `
        <div class="section-title">Investigation Note</div>
        <div class="field full"><textarea id="inv-text" rows="2" placeholder="Add investigation finding..."></textarea></div>
        <div class="modal-actions" style="justify-content:flex-start;">
          <button class="btn btn-ghost btn-sm" id="btn-log-investigation">Add note</button>
        </div>
        <div class="section-title">Resolve Case</div>
        <div class="field full"><textarea id="res-text" rows="2" placeholder="Resolution / sanction..."></textarea></div>
        <div class="modal-actions" style="justify-content:flex-start;">
          <button class="btn btn-primary btn-sm" id="btn-resolve">Resolve case</button>
          <button class="btn btn-danger btn-sm" id="btn-escalate">Escalate</button>
        </div>
      `;
    }

    openDrawer(`
      <h2>${escapeHtml(employeeName(c.employeeId))}</h2>
      <div class="page-sub" style="margin-bottom:10px;">${escapeHtml(c.violation)}</div>
      <div style="margin-bottom:14px;">${caseStatusBadge(c.status)}</div>
      <div class="page-sub">Issued: ${fmtDate(c.dateIssued)} by ${escapeHtml(c.issuedBy)}<br/>Response due: ${fmtDate(c.responseDueDate)}</div>
      <div class="section-title">Notice</div>
      <div class="page-sub">${escapeHtml(c.noticeText)}</div>
      ${c.employeeResponse ? `<div class="section-title">Employee Response</div><div class="page-sub">${escapeHtml(c.employeeResponse)} <span style="color:var(--text-faint);">(${fmtDate(c.employeeResponseDate)})</span></div>` : ''}
      ${c.investigationNotes ? `<div class="section-title">Investigation Notes</div><div class="page-sub">${escapeHtml(c.investigationNotes)}</div>` : ''}
      ${c.resolution ? `<div class="section-title">Resolution</div><div class="page-sub">${escapeHtml(c.resolution)} <span style="color:var(--text-faint);">(${fmtDate(c.resolvedDate)})</span></div>` : ''}

      ${actionHtml}

      <div class="section-title">Audit Trail</div>
      <div class="timeline">
        ${c.history.slice().reverse().map(h => `
          <div class="tl-item"><div class="tl-dot"></div><div class="tl-body">
            <div class="tl-title">${escapeHtml(h.action)}</div>
            <div class="tl-meta">${fmtDate(h.date)}</div>
            <div class="tl-text">${escapeHtml(h.note)}</div>
          </div></div>
        `).join('')}
      </div>
      <div class="modal-actions" style="margin-top:16px;">
        <button class="btn btn-ghost btn-sm" id="btn-del-case">Delete case</button>
      </div>
    `, (dr) => {
      const respBtn = qs('#btn-log-response', dr);
      if (respBtn) respBtn.addEventListener('click', () => {
        const text = qs('#resp-text', dr).value.trim();
        if (!text) { toast('Enter the employee response first.'); return; }
        Store.updateCase(c.id, { employeeResponse: text, employeeResponseDate: todayISO(), status: 'Under Investigation' }, { action: 'Employee Response', note: text });
        Store.updateCase(c.id, {}, { action: 'Investigation', note: 'Case moved to investigation.' });
        toast('Response recorded.');
        openCaseDetail(main, c.id);
        renderList(main);
      });
      const invBtn = qs('#btn-log-investigation', dr);
      if (invBtn) invBtn.addEventListener('click', () => {
        const text = qs('#inv-text', dr).value.trim();
        if (!text) { toast('Enter an investigation note first.'); return; }
        const combined = (c.investigationNotes ? c.investigationNotes + ' ' : '') + text;
        Store.updateCase(c.id, { investigationNotes: combined }, { action: 'Investigation', note: text });
        toast('Investigation note added.');
        openCaseDetail(main, c.id);
        renderList(main);
      });
      const resolveBtn = qs('#btn-resolve', dr);
      if (resolveBtn) resolveBtn.addEventListener('click', () => {
        const text = qs('#res-text', dr).value.trim();
        if (!text) { toast('Enter the resolution first.'); return; }
        Store.updateCase(c.id, { resolution: text, resolvedDate: todayISO(), status: 'Resolved' }, { action: 'Resolved', note: text });
        toast('Case resolved.');
        closeDrawer();
        renderList(main);
      });
      const escBtn = qs('#btn-escalate', dr);
      if (escBtn) escBtn.addEventListener('click', () => {
        Store.updateCase(c.id, { status: 'Escalated' }, { action: 'Escalated', note: 'Case escalated to Management for further action.' });
        toast('Case escalated.');
        closeDrawer();
        renderList(main);
      });
      qs('#btn-del-case', dr).addEventListener('click', () => {
        if (confirm('Delete this disciplinary case?')) {
          Store.deleteCase(c.id);
          closeDrawer();
          toast('Case deleted.');
          renderList(main);
        }
      });
    });
  }

  function openNteForm(main) {
    openModal(`
      <h2>Issue Notice to Explain</h2>
      <div class="modal-sub">Creates a new disciplinary case with status "Notice Issued".</div>
      <form id="nte-form">
        <div class="modal-grid">
          <div class="field full"><label>Employee</label><select name="employeeId">${employeeOptions()}</select></div>
          <div class="field"><label>Date issued</label><input type="date" name="dateIssued" value="${todayISO()}" /></div>
          <div class="field"><label>Response due date</label><input type="date" name="responseDueDate" value="${addDays(todayISO(), 3)}" /></div>
          <div class="field full"><label>Issued by</label><input name="issuedBy" placeholder="e.g. HR Officer name" /></div>
          <div class="field full"><label>Violation</label><input name="violation" required placeholder="e.g. Habitual Tardiness" /></div>
          <div class="field full"><label>Notice details</label><textarea name="noticeText" rows="3" required placeholder="Describe the incident/violation..."></textarea></div>
        </div>
        <div class="modal-actions">
          <button type="button" class="btn btn-ghost" data-close-modal>Cancel</button>
          <button type="submit" class="btn btn-primary">Issue NTE</button>
        </div>
      </form>
    `, (bd) => {
      qs('#nte-form', bd).addEventListener('submit', (ev) => {
        ev.preventDefault();
        const fd = new FormData(ev.target);
        Store.addCase({
          employeeId: fd.get('employeeId'),
          dateIssued: fd.get('dateIssued'),
          responseDueDate: fd.get('responseDueDate'),
          issuedBy: fd.get('issuedBy').trim() || 'HR',
          violation: fd.get('violation').trim(),
          noticeText: fd.get('noticeText').trim(),
          employeeResponse: '', employeeResponseDate: null,
          investigationNotes: '', resolution: '', resolvedDate: null,
        });
        toast('NTE issued.');
        closeModal();
        renderList(main);
      });
    });
  }

  return { render: renderList };
})();

</script>

<script>
/* ================= js/views/attendance.js ================= */
window.Views.attendance = (function () {
  let selectedDate = todayISO();

  function statusDotClass(status) {
    return { Present: 'on', Late: 'late', Absent: 'absent', 'On Leave': 'off' }[status] || '';
  }

  function renderView(main) {
    const employees = Store.listEmployees().filter(e => e.status !== 'Terminated');
    const records = Store.attendanceForDate(selectedDate);
    const recByEmp = {};
    records.forEach(r => { recByEmp[r.employeeId] = r; });

    const present = records.filter(r => r.status === 'Present' || r.status === 'Late').length;

    main.innerHTML = `
      <div class="crumb">HR</div>
      <div class="page-head">
        <div>
          <h1 class="page-title">Attendance</h1>
          <div class="page-sub">Daily attendance and leave monitoring across all staff.</div>
        </div>
        <button class="btn btn-primary" id="btn-log-attendance">+ Log attendance</button>
      </div>

      <div class="filters">
        <div class="field"><label>Date</label><input type="date" id="date-picker" value="${selectedDate}" /></div>
        <button class="btn btn-ghost btn-sm" id="btn-prev-day">← Prev</button>
        <button class="btn btn-ghost btn-sm" id="btn-today">Today</button>
        <button class="btn btn-ghost btn-sm" id="btn-next-day">Next →</button>
      </div>

      <div class="page-sub" style="margin-bottom:10px;">${employees.length} staff members · ${present} on shift on ${fmtDate(selectedDate)}</div>

      <div class="panel">
        <table>
          <thead><tr><th>Name</th><th>Category</th><th>Status</th><th>Time In</th><th>Time Out</th><th class="num">Hours</th><th></th></tr></thead>
          <tbody>
            ${employees.map(e => {
              const r = recByEmp[e.id];
              return `
              <tr>
                <td class="name">${escapeHtml(e.name)}</td>
                <td class="dim">${e.category}</td>
                <td>${r ? `<span class="status-dot ${statusDotClass(r.status)}">${r.status}</span>` : '<span class="status-dot">Not logged</span>'}</td>
                <td class="dim">${r ? r.timeIn : '—'}</td>
                <td class="dim">${r ? r.timeOut : '—'}</td>
                <td class="num">${r ? r.hours : '—'}</td>
                <td><button class="link-btn" data-emp="${e.id}" data-rec="${r ? r.id : ''}">${r ? 'Edit →' : 'Log →'}</button></td>
              </tr>
            `; }).join('')}
          </tbody>
        </table>
      </div>
    `;

    qs('#date-picker', main).addEventListener('change', (e) => { selectedDate = e.target.value; renderView(main); });
    qs('#btn-prev-day', main).addEventListener('click', () => { selectedDate = addDays(selectedDate, -1); renderView(main); });
    qs('#btn-today', main).addEventListener('click', () => { selectedDate = todayISO(); renderView(main); });
    qs('#btn-next-day', main).addEventListener('click', () => { selectedDate = addDays(selectedDate, 1); renderView(main); });
    qs('#btn-log-attendance', main).addEventListener('click', () => openAttendanceModal(main, null, null));
    qsa('[data-emp]', main).forEach(b => b.addEventListener('click', () => openAttendanceModal(main, b.dataset.emp, b.dataset.rec || null)));
  }

  function openAttendanceModal(main, empId, recId) {
    const rec = recId ? Store.listAttendance().find(a => a.id === recId) : null;
    const r = rec || { employeeId: empId || '', date: selectedDate, status: 'Present', timeIn: '08:00', timeOut: '17:00', hours: 8 };

    openModal(`
      <h2>${rec ? 'Edit attendance' : 'Log attendance'}</h2>
      <form id="att-form">
        <div class="modal-grid">
          <div class="field full"><label>Employee</label><select name="employeeId">${employeeOptions(r.employeeId)}</select></div>
          <div class="field"><label>Date</label><input type="date" name="date" value="${r.date}" /></div>
          <div class="field"><label>Status</label>
            <select name="status">${['Present', 'Late', 'Absent', 'On Leave'].map(s => `<option ${s === r.status ? 'selected' : ''}>${s}</option>`).join('')}</select>
          </div>
          <div class="field"><label>Time in</label><input name="timeIn" value="${r.timeIn}" placeholder="08:00" /></div>
          <div class="field"><label>Time out</label><input name="timeOut" value="${r.timeOut}" placeholder="17:00" /></div>
          <div class="field"><label>Hours</label><input type="number" step="0.1" name="hours" value="${r.hours}" /></div>
        </div>
        <div class="modal-actions">
          ${rec ? '<button type="button" class="btn btn-danger" id="btn-del-att">Delete</button>' : ''}
          <button type="button" class="btn btn-ghost" data-close-modal>Cancel</button>
          <button type="submit" class="btn btn-primary">${rec ? 'Save changes' : 'Log attendance'}</button>
        </div>
      </form>
    `, (bd) => {
      qs('#att-form', bd).addEventListener('submit', (ev) => {
        ev.preventDefault();
        const fd = new FormData(ev.target);
        const patch = {
          employeeId: fd.get('employeeId'),
          date: fd.get('date'),
          status: fd.get('status'),
          timeIn: fd.get('timeIn'),
          timeOut: fd.get('timeOut'),
          hours: Number(fd.get('hours')) || 0,
        };
        if (rec) { Store.updateAttendance(rec.id, patch); toast('Attendance updated.'); }
        else { Store.addAttendance(patch); toast('Attendance logged.'); }
        closeModal();
        renderView(main);
      });
      const delBtn = qs('#btn-del-att', bd);
      if (delBtn) delBtn.addEventListener('click', () => {
        Store.deleteAttendance(rec.id);
        closeModal();
        toast('Record deleted.');
        renderView(main);
      });
    });
  }

  return { render: renderView };
})();

</script>

<script>
/* ================= js/views/payroll.js ================= */
window.Views.payroll = (function () {
  let activeTab = 'payroll';
  const today = new Date(todayISO() + 'T00:00:00');
  let group = '10-20';
  let year = today.getFullYear();
  let month = today.getMonth() + 1;
  let half = defaultCutoffHalf(group, today.getDate());

  function setGroup(g) {
    group = g;
    half = defaultCutoffHalf(group, new Date(todayISO() + 'T00:00:00').getDate());
  }

  function shiftMonth(delta) {
    let m = month + delta;
    let y = year;
    while (m < 1) { m += 12; y -= 1; }
    while (m > 12) { m -= 12; y += 1; }
    month = m; year = y;
  }

  function computeRow(emp, from, to) {
    const attendanceDays = Store.attendanceInRange(from, to).filter(a => a.employeeId === emp.id && (a.status === 'Present' || a.status === 'Late')).length;
    const override = Store.getPayrollOverride(emp.id, from);
    const daysPresent = override ? Number(override.daysPresent) : attendanceDays;
    const isOverridden = !!override;
    const basePay = emp.payType === 'Daily' ? emp.rate * daysPresent : emp.rate;
    const allowance = (emp.allowancePerDay || 0) * daysPresent + (emp.fixedAllowance || 0);
    const gross = basePay + allowance;
    const tax = withholdingTax(gross);
    const dedTotal = Store.deductionsInRange(from, to).filter(d => d.employeeId === emp.id).reduce((s, d) => s + Number(d.amount), 0);
    const net = gross - tax - dedTotal;
    return { emp, daysPresent, isOverridden, basePay, allowance, gross, tax, dedTotal, net };
  }

  function renderView(main) {
    main.innerHTML = `
      <div class="crumb">HR</div>
      <div class="page-head">
        <div>
          <h1 class="page-title">Payroll</h1>
          <div class="page-sub">Engineers, Managers, and Admins are paid every 10th &amp; 20th of the month. Technicians are paid every 15th &amp; 30th/31st. Gross pay = base pay + allowance; net pay = gross pay − withholding tax − deductions.</div>
        </div>
        ${activeTab === 'deductions' ? '<button class="btn btn-primary" id="btn-new-deduction">+ New deduction</button>' : ''}
      </div>

      <div class="tabs">
        <div class="tab ${activeTab === 'payroll' ? 'active' : ''}" data-tab="payroll">Payroll</div>
        <div class="tab ${activeTab === 'deductions' ? 'active' : ''}" data-tab="deductions">Deductions</div>
      </div>

      <div id="tab-body"></div>
    `;

    qsa('.tab', main).forEach(t => t.addEventListener('click', () => { activeTab = t.dataset.tab; renderView(main); }));
    const btnNew = qs('#btn-new-deduction', main);
    if (btnNew) btnNew.addEventListener('click', () => openDeductionForm(main));

    if (activeTab === 'payroll') renderPayrollTab(qs('#tab-body', main), main);
    else renderDeductionsTab(qs('#tab-body', main), main);
  }

  function renderPayrollTab(body, main) {
    const cutoffs = payCutoffs(group, year, month);
    const selected = cutoffs.find(c => c.key === half) || cutoffs[0];
    const monthValue = `${year}-${pad2(month)}`;
    const monthLabel = new Date(year, month - 1, 1).toLocaleDateString('en-US', { month: 'long', year: 'numeric' });

    const employees = Store.listEmployees().filter(e => e.payCycle === group && e.status !== 'Terminated');
    const rows = employees.map(e => computeRow(e, selected.from, selected.to));
    rows.sort((a, b) => a.emp.name.localeCompare(b.emp.name));

    const totalGross = rows.reduce((s, r) => s + r.gross, 0);
    const totalAllowance = rows.reduce((s, r) => s + r.allowance, 0);
    const totalTax = rows.reduce((s, r) => s + r.tax, 0);
    const totalDed = rows.reduce((s, r) => s + r.dedTotal, 0);
    const totalNet = rows.reduce((s, r) => s + r.net, 0);

    body.innerHTML = `
      <div class="filters">
        <div class="field">
          <label>Pay group</label>
          <div class="seg" id="seg-group">
            <button data-val="10-20" class="${group === '10-20' ? 'active' : ''}">Engineers / Managers / Admins</button>
            <button data-val="15-30" class="${group === '15-30' ? 'active' : ''}">Technicians</button>
          </div>
        </div>
      </div>

      <div class="filters">
        <button class="btn btn-ghost btn-sm" id="btn-prev-month">← Prev month</button>
        <div class="field"><label>Month</label><input type="month" id="month-input" value="${monthValue}" /></div>
        <button class="btn btn-ghost btn-sm" id="btn-next-month">Next month →</button>
        <div class="field">
          <label>Cutoff</label>
          <div class="seg" id="seg-cutoff">
            ${cutoffs.map(c => `<button data-val="${c.key}" class="${half === c.key ? 'active' : ''}">${c.label}</button>`).join('')}
          </div>
        </div>
      </div>

      <div class="page-sub" style="margin-bottom:10px;">${monthLabel} · ${selected.label} · payday ${fmtDate(selected.payDate)} · ${rows.length} staff on this schedule</div>

      <div class="kpi-row">
        <div class="kpi-card"><div class="kpi-label">Total Base + Allowance (Gross)</div><div class="kpi-value" style="font-size:20px;">${fmtMoney(totalGross)}</div><div class="kpi-sub">incl. ${fmtMoney(totalAllowance)} allowance</div></div>
        <div class="kpi-card"><div class="kpi-label">Total Withholding Tax</div><div class="kpi-value ${totalTax ? 'red' : ''}" style="font-size:20px;">${fmtMoney(totalTax)}</div></div>
        <div class="kpi-card"><div class="kpi-label">Total Deductions</div><div class="kpi-value ${totalDed ? 'red' : ''}" style="font-size:20px;">${fmtMoney(totalDed)}</div></div>
        <div class="kpi-card"><div class="kpi-label">Total Net Pay</div><div class="kpi-value green" style="font-size:20px;">${fmtMoney(totalNet)}</div></div>
        <div class="kpi-card"><div class="kpi-label">Staff on Schedule</div><div class="kpi-value">${rows.length}</div></div>
      </div>

      <div class="hint">Days present is editable — type over it and press Enter or click away to recompute allowance, gross, tax, and net pay for that cutoff. Edited values are saved and override the attendance-derived count.</div>

      <div class="panel">
        ${rows.length ? `
        <table>
          <thead><tr><th>Staff</th><th>Position</th><th class="num">Days Present</th><th class="num">Base Pay</th><th class="num">Allowance</th><th class="num">Gross Pay</th><th class="num">Withholding Tax</th><th class="num">Deductions</th><th class="num">Net Pay</th></tr></thead>
          <tbody>
            ${rows.map(r => `
              <tr>
                <td class="name">${escapeHtml(r.emp.name)}</td>
                <td class="dim">${escapeHtml(r.emp.position)}</td>
                <td class="num">
                  <input type="number" class="days-input" min="0" step="0.5" value="${r.daysPresent}" data-emp="${r.emp.id}" title="${r.isOverridden ? 'Manually edited — overrides attendance count' : 'From attendance records'}" style="${r.isOverridden ? 'border-color:var(--accent);' : ''}" />
                </td>
                <td class="num">${fmtMoney(r.basePay)}</td>
                <td class="num ${r.allowance ? '' : 'dim'}">${r.allowance ? fmtMoney(r.allowance) : '—'}</td>
                <td class="num" style="font-weight:600;">${fmtMoney(r.gross)}</td>
                <td class="num ${r.tax ? '' : 'dim'}">${r.tax ? fmtMoney(r.tax) : '—'}</td>
                <td class="num ${r.dedTotal ? '' : 'dim'}">${r.dedTotal ? fmtMoney(r.dedTotal) : '—'}</td>
                <td class="num" style="font-weight:700;">${fmtMoney(r.net)}</td>
              </tr>
            `).join('')}
          </tbody>
        </table>` : '<div class="empty">No staff assigned to this pay schedule.</div>'}
      </div>
    `;

    qsa('.days-input', body).forEach(input => {
      input.addEventListener('change', () => {
        const val = Number(input.value);
        if (!isNaN(val) && val >= 0) {
          Store.setPayrollOverride(input.dataset.emp, selected.from, val);
          renderPayrollTab(body, main);
        }
      });
    });
    qsa('#seg-group button', body).forEach(b => b.addEventListener('click', () => { setGroup(b.dataset.val); renderPayrollTab(body, main); }));
    qsa('#seg-cutoff button', body).forEach(b => b.addEventListener('click', () => { half = b.dataset.val; renderPayrollTab(body, main); }));
    qs('#month-input', body).addEventListener('change', (ev) => {
      const [y, m] = ev.target.value.split('-').map(Number);
      year = y; month = m;
      renderPayrollTab(body, main);
    });
    qs('#btn-prev-month', body).addEventListener('click', () => { shiftMonth(-1); renderPayrollTab(body, main); });
    qs('#btn-next-month', body).addEventListener('click', () => { shiftMonth(1); renderPayrollTab(body, main); });
  }

  function renderDeductionsTab(body, main) {
    const rows = Store.listDeductions().slice().sort((a, b) => b.date.localeCompare(a.date));
    const total = rows.reduce((s, d) => s + Number(d.amount), 0);

    body.innerHTML = `
      <div class="hint">Deductions roll up to each staff member's net pay on the Payroll tab, matched by date against the selected cutoff. Use this list to log cash advances, tardiness, damage, and anything else under "Other."</div>
      <div class="panel">
        <div class="panel-head"><h3>${rows.length} entries</h3><div class="dim">Total ${fmtMoney(total)}</div></div>
        ${rows.length ? `
        <table>
          <thead><tr><th>Date</th><th>Staff</th><th>Kind</th><th>Notes</th><th class="num">Amount</th><th></th></tr></thead>
          <tbody>
            ${rows.map(d => `
              <tr>
                <td class="dim">${fmtDate(d.date)}</td>
                <td class="name">${escapeHtml(employeeName(d.employeeId))}</td>
                <td><span class="badge badge-gray">${d.kind}</span></td>
                <td class="dim">${escapeHtml(d.notes || '—')}</td>
                <td class="num">${fmtMoney(d.amount)}</td>
                <td><button class="link-btn" data-del="${d.id}">Delete</button></td>
              </tr>
            `).join('')}
          </tbody>
        </table>` : '<div class="empty">No deductions yet. Add one with the button above.</div>'}
      </div>
    `;

    qsa('[data-del]', body).forEach(b => b.addEventListener('click', () => {
      if (confirm('Delete this deduction?')) {
        Store.deleteDeduction(b.dataset.del);
        toast('Deduction deleted.');
        renderDeductionsTab(body, main);
      }
    }));
  }

  function openDeductionForm(main) {
    openModal(`
      <h2>New deduction</h2>
      <form id="ded-form">
        <div class="modal-grid">
          <div class="field full"><label>Employee</label><select name="employeeId">${employeeOptions()}</select></div>
          <div class="field"><label>Date</label><input type="date" name="date" value="${todayISO()}" /></div>
          <div class="field"><label>Kind</label>
            <select name="kind">${['Cash Advance', 'Tardy', 'Damage', 'Other'].map(k => `<option>${k}</option>`).join('')}</select>
          </div>
          <div class="field full"><label>Amount (PHP)</label><input type="number" name="amount" min="0" step="0.01" required /></div>
          <div class="field full"><label>Notes</label><textarea name="notes" rows="2"></textarea></div>
        </div>
        <div class="modal-actions">
          <button type="button" class="btn btn-ghost" data-close-modal>Cancel</button>
          <button type="submit" class="btn btn-primary">Add deduction</button>
        </div>
      </form>
    `, (bd) => {
      qs('#ded-form', bd).addEventListener('submit', (ev) => {
        ev.preventDefault();
        const fd = new FormData(ev.target);
        Store.addDeduction({
          employeeId: fd.get('employeeId'),
          date: fd.get('date'),
          kind: fd.get('kind'),
          notes: fd.get('notes').trim(),
          amount: Number(fd.get('amount')) || 0,
        });
        toast('Deduction added.');
        closeModal();
        renderView(main);
      });
    });
  }

  return { render: renderView };
})();

</script>

<script>
/* ================= js/views/complaints.js ================= */
window.Views.complaints = (function () {
  let filterStatus = 'Open';

  function renderList(main) {
    const all = Store.listComplaints();
    let rows = all.slice();
    if (filterStatus === 'Open') rows = rows.filter(c => c.status === 'Open' || c.status === 'In Progress');
    else if (filterStatus !== 'All') rows = rows.filter(c => c.status === filterStatus);
    rows.sort((a, b) => b.dateReceived.localeCompare(a.dateReceived));

    main.innerHTML = `
      <div class="crumb">Records</div>
      <div class="page-head">
        <div>
          <h1 class="page-title">Customer Complaints</h1>
          <div class="page-sub">Log, assign, and track customer complaints through to resolution.</div>
        </div>
        <button class="btn btn-primary" id="btn-log-complaint">+ Log complaint</button>
      </div>

      <div class="filters">
        <div class="field">
          <label>Status</label>
          <div class="seg" id="seg-status">
            ${['Open', 'All', 'Resolved', 'Closed'].map(s => `<button data-val="${s}" class="${filterStatus === s ? 'active' : ''}">${s}</button>`).join('')}
          </div>
        </div>
      </div>

      <div class="panel">
        ${rows.length ? `
        <table>
          <thead><tr><th>Customer</th><th>Description</th><th>Assigned</th><th>Priority</th><th>Status</th><th>Received</th></tr></thead>
          <tbody>
            ${rows.map(c => `
              <tr>
                <td class="name row-link" data-open="${c.id}">${escapeHtml(c.customerName)}</td>
                <td class="dim" style="max-width:280px;">${escapeHtml(c.description.length > 60 ? c.description.slice(0, 60) + '…' : c.description)}</td>
                <td class="dim">${c.assignedTo ? escapeHtml(employeeName(c.assignedTo)) : '—'}</td>
                <td>${priorityBadge(c.priority)}</td>
                <td>${complaintStatusBadge(c.status)}</td>
                <td class="dim">${fmtDate(c.dateReceived)}</td>
              </tr>
            `).join('')}
          </tbody>
        </table>` : '<div class="empty">No complaints match this filter.</div>'}
      </div>
    `;

    qs('#btn-log-complaint', main).addEventListener('click', () => openComplaintForm(main));
    qsa('#seg-status button', main).forEach(b => b.addEventListener('click', () => { filterStatus = b.dataset.val; renderList(main); }));
    qsa('[data-open]', main).forEach(el => el.addEventListener('click', () => openComplaintDetail(main, el.dataset.open)));
  }

  function openComplaintDetail(main, id) {
    const c = Store.getComplaint(id);
    if (!c) return;

    openDrawer(`
      <h2>${escapeHtml(c.customerName)}</h2>
      <div class="page-sub" style="margin-bottom:10px;">${escapeHtml(c.contact || '—')}</div>
      <div style="margin-bottom:14px; display:flex; gap:8px;">${priorityBadge(c.priority)}${complaintStatusBadge(c.status)}</div>
      <div class="section-title">Description</div>
      <div class="page-sub">${escapeHtml(c.description)}</div>
      <div class="page-sub" style="margin-top:8px;">Received: ${fmtDate(c.dateReceived)}<br/>Assigned to: ${c.assignedTo ? escapeHtml(employeeName(c.assignedTo)) : 'Unassigned'}</div>
      ${c.resolutionNotes ? `<div class="section-title">Resolution Notes</div><div class="page-sub">${escapeHtml(c.resolutionNotes)}</div>` : ''}

      <div class="section-title">Update</div>
      <div class="modal-grid">
        <div class="field"><label>Assign to</label><select id="assign-select">${employeeOptions(c.assignedTo)}</select></div>
        <div class="field"><label>Status</label>
          <select id="status-select">${['Open', 'In Progress', 'Resolved', 'Closed'].map(s => `<option ${s === c.status ? 'selected' : ''}>${s}</option>`).join('')}</select>
        </div>
        <div class="field full"><label>Resolution notes</label><textarea id="notes-input" rows="2">${escapeHtml(c.resolutionNotes || '')}</textarea></div>
      </div>
      <div class="modal-actions" style="justify-content:flex-start;">
        <button class="btn btn-primary btn-sm" id="btn-save-complaint">Save update</button>
        <button class="btn btn-ghost btn-sm" id="btn-del-complaint">Delete</button>
      </div>
    `, (dr) => {
      qs('#btn-save-complaint', dr).addEventListener('click', () => {
        const status = qs('#status-select', dr).value;
        const patch = {
          assignedTo: qs('#assign-select', dr).value || null,
          status,
          resolutionNotes: qs('#notes-input', dr).value.trim(),
        };
        if (status === 'Resolved' && c.status !== 'Resolved') patch.resolvedDate = todayISO();
        Store.updateComplaint(c.id, patch);
        toast('Complaint updated.');
        closeDrawer();
        renderList(main);
      });
      qs('#btn-del-complaint', dr).addEventListener('click', () => {
        if (confirm('Delete this complaint?')) {
          Store.deleteComplaint(c.id);
          closeDrawer();
          toast('Complaint deleted.');
          renderList(main);
        }
      });
    });
  }

  function openComplaintForm(main) {
    openModal(`
      <h2>Log complaint</h2>
      <form id="complaint-form">
        <div class="modal-grid">
          <div class="field full"><label>Customer name</label><input name="customerName" required /></div>
          <div class="field"><label>Contact</label><input name="contact" placeholder="Phone or email" /></div>
          <div class="field"><label>Date received</label><input type="date" name="dateReceived" value="${todayISO()}" /></div>
          <div class="field"><label>Priority</label>
            <select name="priority">${['Low', 'Medium', 'High'].map(p => `<option ${p === 'Medium' ? 'selected' : ''}>${p}</option>`).join('')}</select>
          </div>
          <div class="field"><label>Assign to</label><select name="assignedTo"><option value="">Unassigned</option>${employeeOptions()}</select></div>
          <div class="field full"><label>Description</label><textarea name="description" rows="3" required></textarea></div>
        </div>
        <div class="modal-actions">
          <button type="button" class="btn btn-ghost" data-close-modal>Cancel</button>
          <button type="submit" class="btn btn-primary">Log complaint</button>
        </div>
      </form>
    `, (bd) => {
      qs('#complaint-form', bd).addEventListener('submit', (ev) => {
        ev.preventDefault();
        const fd = new FormData(ev.target);
        Store.addComplaint({
          customerName: fd.get('customerName').trim(),
          contact: fd.get('contact').trim(),
          dateReceived: fd.get('dateReceived'),
          priority: fd.get('priority'),
          assignedTo: fd.get('assignedTo') || null,
          description: fd.get('description').trim(),
          status: 'Open',
          resolutionNotes: '',
          resolvedDate: null,
        });
        toast('Complaint logged.');
        closeModal();
        renderList(main);
      });
    });
  }

  return { render: renderList };
})();

</script>
