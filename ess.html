<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://*.supabase.co; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://nominatim.openstreetmap.org; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none';" />
<title>TxTAIRE · My Portal</title>
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#4f8dff" />
<link rel="icon" href="assets/icon-192.png" />
<link rel="apple-touch-icon" href="assets/icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="My Portal" />
<link rel="stylesheet" href="css/styles.css" />
<link rel="stylesheet" href="css/ess.css" />
</head>
<body>
<div id="ess-login" class="hidden"></div>
<div id="ess-app" class="hidden">
  <header class="ess-header">
    <img src="assets/logo.svg" alt="TxTAIRE" class="ess-logo" />
    <button id="ess-logout" class="link-btn">Sign out</button>
  </header>
  <main id="ess-main" class="ess-main"></main>
  <nav id="ess-nav" class="ess-nav">
    <button class="ess-nav-btn" data-route="attendance"><span class="ess-nav-ic">&#128337;</span>My Attendance</button>
    <button class="ess-nav-btn" data-route="payroll"><span class="ess-nav-ic">&#128176;</span>My Payroll</button>
    <button class="ess-nav-btn" data-route="leave"><span class="ess-nav-ic">&#128196;</span>My Leave</button>
    <div class="ess-nav-spacer"></div>
    <button class="ess-nav-btn" data-route="profile"><span class="ess-nav-ic">&#128100;</span>My Profile</button>
    <button class="ess-nav-btn" data-route="notifications">
      <span class="ess-nav-ic">&#128276;<span id="ess-nav-notif-badge" class="ess-bell-badge hidden">0</span></span>
      Notifications
    </button>
    <button type="button" id="ess-fab-clock" class="ess-fab" title="Time In / Time Out" aria-label="Quick Time In or Time Out">+</button>
  </nav>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.110.9/dist/umd/supabase.js"
  integrity="sha384-6foGJ1oz/y3anEo0BXRtTgBK1GvpnR0GbJZb0ijG+nBAJ4rYT+VqlD/9e3CSiFIA"
  crossorigin="anonymous"></script>
<script src="js/supabase-config.js"></script>
<script src="js/store.js"></script>
<script src="js/offline-queue.js"></script>
<script src="js/ess-app.js"></script>
<script src="js/ess-views/attendance.js"></script>
<script src="js/ess-views/payroll.js"></script>
<script src="js/ess-views/leave.js"></script>
<script src="js/ess-views/profile.js"></script>
<script src="js/ess-views/notifications.js"></script>
<script src="js/register-sw.js"></script>
</body>
</html>
