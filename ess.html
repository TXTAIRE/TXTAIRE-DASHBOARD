<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-eval' https://cdn.jsdelivr.net; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://*.supabase.co; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://nominatim.openstreetmap.org; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none';" />
<title>TXTAIRE MY PORTAL</title>
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#4f8dff" />
<link rel="icon" href="assets/icon-192.png" />
<link rel="apple-touch-icon" href="assets/icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="TXTAIRE" />
<link rel="stylesheet" href="css/styles.css" />
<link rel="stylesheet" href="css/ess.css" />
</head>
<body>
<div id="ess-login" class="hidden"></div>
<div id="ess-app" class="hidden">
  <header class="ess-header">
    <img src="assets/logo.svg" alt="TxTAIRE" class="ess-logo" />
    <button id="ess-logout" class="link-btn">Sign out</button>
  </header>
  <main id="ess-main" class="ess-main"></main>
  <nav id="ess-nav" class="ess-nav">
    <button class="ess-nav-btn" data-route="attendance">
      <span class="ess-nav-ic"><svg viewBox="0 0 36 36" width="22" height="22"><circle cx="18" cy="18" r="17" fill="#15803d"/><circle cx="18" cy="18" r="10" fill="none" stroke="#fff" stroke-width="2"/><path d="M18 12v6l4 3" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
      My Attendance
    </button>
    <button class="ess-nav-btn" data-route="payroll">
      <span class="ess-nav-ic"><svg viewBox="0 0 36 36" width="22" height="22"><circle cx="18" cy="18" r="17" fill="#15803d"/><rect x="8" y="13" width="20" height="12" rx="2" fill="none" stroke="#fff" stroke-width="2"/><circle cx="18" cy="19" r="3.2" fill="none" stroke="#fff" stroke-width="1.6"/></svg></span>
      My Payroll
    </button>
    <button class="ess-nav-btn" data-route="leave">
      <span class="ess-nav-ic"><svg viewBox="0 0 36 36" width="22" height="22"><circle cx="18" cy="18" r="17" fill="#15803d"/><path d="M13 9h7l4 4v14a1 1 0 0 1-1 1H13a1 1 0 0 1-1-1V10a1 1 0 0 1 1-1z" fill="#fff"/><path d="M20 9v4h4" fill="none" stroke="#15803d" stroke-width="1.4"/><line x1="14.5" y1="17" x2="21.5" y2="17" stroke="#15803d" stroke-width="1.4"/><line x1="14.5" y1="20" x2="21.5" y2="20" stroke="#15803d" stroke-width="1.4"/><line x1="14.5" y1="23" x2="19" y2="23" stroke="#15803d" stroke-width="1.4"/></svg></span>
      My Leave
    </button>
    <div class="ess-nav-spacer"></div>
    <button class="ess-nav-btn" data-route="profile">
      <span class="ess-nav-ic"><svg viewBox="0 0 36 36" width="22" height="22"><defs><clipPath id="clip-person"><circle cx="18" cy="18" r="17"/></clipPath></defs><circle cx="18" cy="18" r="17" fill="#15803d"/><g clip-path="url(#clip-person)"><circle cx="18" cy="14.5" r="4.5" fill="#fff"/><path d="M9 28c1.2-4.8 5-7.5 9-7.5s7.8 2.7 9 7.5" fill="#fff"/></g></svg></span>
      My Profile
    </button>
    <button class="ess-nav-btn" data-route="notifications">
      <span class="ess-nav-ic"><svg viewBox="0 0 36 36" width="22" height="22"><circle cx="18" cy="18" r="17" fill="#15803d"/><path d="M18 10c-3 0-5 2.2-5 5.5v3.3c0 1-.4 2-1.1 2.7l-.9.9h14l-.9-.9a3.8 3.8 0 0 1-1.1-2.7v-3.3c0-3.3-2-5.5-5-5.5z" fill="#fff"/><path d="M16 24a2 2 0 0 0 4 0" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round"/></svg><span id="ess-nav-notif-badge" class="ess-bell-badge hidden">0</span></span>
      Notifications
    </button>
    <button class="ess-nav-btn" data-route="settings">
      <span class="ess-nav-ic"><svg viewBox="0 0 36 36" width="22" height="22"><circle cx="18" cy="18" r="17" fill="#15803d"/><g fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="18" r="4"/><path d="M18 8v2.4M18 25.6V28M28 18h-2.4M10.4 18H8M24.6 11.4l-1.7 1.7M13.1 22.9l-1.7 1.7M24.6 24.6l-1.7-1.7M13.1 13.1l-1.7-1.7"/></g></svg></span>
      Settings
    </button>
    <button type="button" id="ess-fab-clock" class="ess-fab" title="Time In / Time Out" aria-label="Quick Time In or Time Out">+</button>
  </nav>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.110.9/dist/umd/supabase.js"
  integrity="sha384-6foGJ1oz/y3anEo0BXRtTgBK1GvpnR0GbJZb0ijG+nBAJ4rYT+VqlD/9e3CSiFIA"
  crossorigin="anonymous"></script>
<script src="js/supabase-config.js"></script>
<script src="js/store.js"></script>
<script src="js/offline-queue.js"></script>
<script src="js/ess-app.js"></script>
<script src="js/ess-views/attendance.js"></script>
<script src="js/ess-views/payroll.js"></script>
<script src="js/ess-views/leave.js"></script>
<script src="js/ess-views/profile.js"></script>
<script src="js/ess-views/notifications.js"></script>
<script src="js/ess-views/settings.js"></script>
<script src="js/register-sw.js"></script>
</body>
</html>
