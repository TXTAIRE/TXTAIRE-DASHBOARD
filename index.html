<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://*.supabase.co; connect-src 'self' https://*.supabase.co wss://*.supabase.co; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none';" />
<title>TxTAIRE · HR & Operations</title>
<link rel="manifest" href="manifest-admin.json" />
<meta name="theme-color" content="#4f8dff" />
<link rel="icon" href="assets/icon-192.png" />
<link rel="apple-touch-icon" href="assets/icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="TxTAIRE HR" />
<link rel="stylesheet" href="css/styles.css" />
</head>
<body>
<div id="auth-screen" class="hidden"></div>

<div id="app" class="hidden">
  <aside class="sidebar">
    <div class="brand">
      <img src="assets/logo.svg" alt="TxTAIRE Refrigeration and Air-conditioning Services" class="brand-logo" />
    </div>

    <nav id="sidebar-nav">
      <div class="nav-group">
        <div class="nav-label">General</div>
        <a class="nav-item" data-route="overview"><span class="ic">&#9635;</span> Overview</a>
      </div>
      <div class="nav-group">
        <div class="nav-label">HR</div>
        <a class="nav-item" data-route="staff"><span class="ic">👥</span> Employee Management</a>
        <a class="nav-item" data-route="recruitment"><span class="ic">📋</span> Recruitment &amp; Hiring</a>
        <a class="nav-item" data-route="probation"><span class="ic">📝</span> Probation / Regularization</a>
        <a class="nav-item" data-route="disciplinary"><span class="ic">⚖️</span> Employee Discipline (NTE)</a>
        <a class="nav-item" data-route="attendance"><span class="ic">🕒</span> Attendance &amp; Timekeeping</a>
        <a class="nav-item" data-route="payroll"><span class="ic">💰</span> Payroll Management</a>
        <a class="nav-item" data-route="leaveRequests"><span class="ic">🌴</span> Leave Management</a>
        <a class="nav-item" data-route="attendanceCorrections"><span class="ic">✏️</span> Attendance Adjustments</a>
      </div>
      <div class="nav-group">
        <div class="nav-label">Records</div>
        <a class="nav-item" data-route="complaints"><span class="ic">📢</span> Employee Complaints</a>
        <a class="nav-item" data-route="auditLog"><span class="ic">🔍</span> Audit Trail</a>
      </div>
      <div class="nav-group">
        <div class="nav-label">Admin</div>
        <a class="nav-item" data-route="finance"><span class="ic">&#128188;</span> Office &amp; Finance</a>
      </div>
    </nav>

    <div class="sidebar-foot">
      <div class="avatar-chip">HR</div>
      <div style="flex:1; min-width:0;">
        <div id="user-email" style="color:var(--text); font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">&nbsp;</div>
        <div style="font-size:11px;">TxTAIRE</div>
      </div>
      <button id="btn-logout" class="link-btn" title="Sign out">Sign out</button>
    </div>
  </aside>

  <main class="main" id="main-content"></main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.110.9/dist/umd/supabase.js"
  integrity="sha384-6foGJ1oz/y3anEo0BXRtTgBK1GvpnR0GbJZb0ijG+nBAJ4rYT+VqlD/9e3CSiFIA"
  crossorigin="anonymous"></script>
<script src="js/supabase-config.js"></script>
<script src="js/store.js"></script>
<script src="js/views/overview.js"></script>
<script src="js/views/staff.js"></script>
<script src="js/views/recruitment.js"></script>
<script src="js/views/probation.js"></script>
<script src="js/views/disciplinary.js"></script>
<script src="js/views/attendance.js"></script>
<script src="js/views/payroll.js"></script>
<script src="js/views/complaints.js"></script>
<script src="js/views/leaveRequests.js"></script>
<script src="js/views/attendanceCorrections.js"></script>
<script src="js/views/auditLog.js"></script>
<script src="js/views/finance.js"></script>
<script src="js/auth.js"></script>
<script src="js/app.js"></script>
<script src="js/register-sw.js"></script>
</body>
</html>
